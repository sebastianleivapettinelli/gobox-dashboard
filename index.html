            `;
        }

        // ============================================
        // ANALÍTICA
        // ============================================
        // Resumen por mes (respeta el filtro de máquina)
        function getResumenMensual() {
            const filtro = state.maquinaFiltro;
            const por = {};
            state.ventas.forEach(v => {
                if (!esVentaValida(v)) return;
                const f = fechaDeVenta(v); if (!f) return;
                const m = getMaquinaDeVenta(v);
                if (filtro !== 'todas' && (!m || String(m.id) !== String(filtro))) return;
                const ym = f.substring(0, 7);
                const r = por[ym] = por[ym] || { ym, trx: 0, unidades: 0, monto: 0, comision: 0, dias: new Set(), porMaquina: {} };
                const monto = parseFloat(v.monto_venta || 0);
                r.trx++; r.monto += monto; r.unidades += unidadesDeVenta(v);
                r.comision += parseFloat(v.comision || 0);
                r.dias.add(f);
                const mid = m ? m.id : 'sin';
                r.porMaquina[mid] = r.porMaquina[mid] || { monto: 0, trx: 0 };
                r.porMaquina[mid].monto += monto; r.porMaquina[mid].trx++;
            });
            const lista = Object.values(por).sort((a, b) => b.ym.localeCompare(a.ym));
            lista.forEach(r => {
                r.nDias = r.dias.size;
                r.promDia = r.nDias ? r.monto / r.nDias : 0;
                r.ticket = r.trx ? r.monto / r.trx : 0;
                r.neto = r.monto - r.comision;
            });
            lista.forEach((r, i) => {
                const ant = lista[i + 1];
                r.varPromDia = ant && ant.promDia ? (r.promDia - ant.promDia) / ant.promDia : null;
                const fechas = [...r.dias].sort();
                r.desde = fechas[0]; r.hasta = fechas[fechas.length - 1];
                r.parcial = r.desde > `${r.ym}-01` || r.hasta < ultimoDiaMes(r.ym);
            });
            return lista;
        }

        // Ranking de espacios del período elegido (respeta el filtro de máquina)
        function getRankingEspacios() {
            const r = getRangoPeriodo();
            const por = {};
            ventasEntre(r.desde, r.hasta).forEach(v => {
                const m = getMaquinaDeVenta(v);
                const e = normEspacio(v.espacio);
                if (!m || !e) return;
                const k = `${m.id}|${e}`;
                const x = por[k] = por[k] || { maquina: m, espacio: e, unidades: 0, trx: 0, monto: 0, producto: getProductoDeVenta(v) };
                x.unidades += unidadesDeVenta(v); x.trx++; x.monto += parseFloat(v.monto_venta || 0);
            });
            const lista = Object.values(por).sort((a, b) => b.monto - a.monto || b.unidades - a.unidades);
            const total = lista.reduce((s, x) => s + x.monto, 0);
            let acum = 0;
            lista.forEach(x => { acum += x.monto; x.pct = total ? x.monto / total : 0; x.pctAcum = total ? acum / total : 0; });
            return { lista, total };
        }

        function bandejaPos(e) {
            const n = parseInt(e, 10);
            return `B${Math.floor((n - 1) / POSICIONES_TCN) + 1}·P${((n - 1) % POSICIONES_TCN) + 1}`;
        }

        // Escala secuencial azul (un solo tono, claro → oscuro)
        const RAMPA_AZUL = ['#cde2fb', '#b7d3f6', '#9ec5f4', '#86b6ef', '#6da7ec', '#5598e7', '#3987e5', '#2a78d6', '#256abf', '#1c5cab', '#184f95', '#104281'];
        function colorCalor(valor, max) {
            if (!valor || !max) return null;
            const i = Math.min(RAMPA_AZUL.length - 1, Math.floor((valor / max) * (RAMPA_AZUL.length - 1)));
            return { bg: RAMPA_AZUL[i], fg: i >= 6 ? '#ffffff' : '#0b0b0b' };
        }

        window.toggleVerTodosEspacios = function() {
            state.analiticaVerTodos = !state.analiticaVerTodos;
            render();
        };

        function renderAnalytics() {
            const resumen = getResumenMensual();
            const rango = getRangoPeriodo();
            const { lista: ranking, total: totalPeriodo } = getRankingEspacios();
            const n80 = ranking.findIndex(x => x.pctAcum >= 0.8) + 1;
            const maqs = (state.maquinaFiltro === 'todas' ? state.maquinas : state.maquinas.filter(m => String(m.id) === String(state.maquinaFiltro)))
                .slice().sort((a, b) => String(a.id).localeCompare(String(b.id)));
            const verTodos = state.analiticaVerTodos;
            const filasRanking = verTodos ? ranking : ranking.slice(0, 15);
            const pct = x => (x * 100).toFixed(1).replace('.', ',') + '%';

            // Mapa de calor + espacios asignados sin ventas, por máquina
            const mapas = maqs.map(m => {
                const ventas = getVentasHoyPorEspacio(m.id);
                const max = Math.max(0, ...Object.values(ventas).map(x => x.unidades));
                const filas = m.total_filas || 6, cols = m.total_columnas || 10;
                const asignadas = state.asignaciones.filter(a => String(a.maquina_id) === String(m.id));
                const sinVentas = asignadas.filter(a => !ventas[normEspacio(a.espacio)])
                    .map(a => ({ e: normEspacio(a.espacio), p: state.inventario.find(p => String(p.sku) === String(a.sku)) }))
                    .sort((a, b) => Number(a.e) - Number(b.e));
                let celdas = '';
                for (let f = 1; f <= filas; f++) {
                    celdas += `<div class="text-[11px] font-bold text-gray-500 flex items-center">B${f}</div>`;
                    for (let c = 1; c <= cols; c++) {
                        const e = codigoEspacio(f, c);
                        const v = ventas[e];
                        const asig = asignadas.find(a => normEspacio(a.espacio) === e);
                        const prod = asig ? state.inventario.find(p => String(p.sku) === String(asig.sku)) : null;
                        const col = colorCalor(v ? v.unidades : 0, max);
                        const titulo = `Espacio ${e} (${bandejaPos(e)})${prod ? ' · ' + prod.nombre_producto : ''}: ${v ? v.unidades + ' unid. · $' + clp(v.monto) : 'sin ventas'}`;
                        celdas += `<div title="${esc(titulo)}" class="rounded text-[10px] leading-tight p-1 h-12 flex flex-col justify-between overflow-hidden ${col ? '' : (asig ? 'bg-gray-100 text-gray-500' : 'bg-white border border-dashed border-gray-200 text-gray-300')}" ${col ? `style="background:${col.bg};color:${col.fg}"` : ''}>
                            <span class="font-bold">${e}</span>
                            <span class="truncate">${prod ? esc(String(prod.nombre_producto).substring(0, 12)) : ''}</span>
                            <span class="font-bold">${v ? v.unidades : ''}</span>
                        </div>`;
                    }
                }
                return `
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="inline-block w-3 h-3 rounded-sm" style="background:${colorMaquina(m.id)}"></span>
                            <h3 class="font-bold text-lg">${esc(m.nombre)} · unidades vendidas por espacio</h3>
                        </div>
                        <p class="text-xs text-gray-500 mb-3">${esc(rango.label)} · más oscuro = más unidades · pasa el cursor sobre un espacio para ver el detalle</p>
                        <div class="overflow-x-auto">
                            <div class="grid gap-1 min-w-[640px]" style="grid-template-columns: 28px repeat(${cols}, minmax(0, 1fr));">${celdas}</div>
                        </div>
                        <div class="flex items-center gap-2 mt-3 text-xs text-gray-600">
                            <span>0</span>
                            <div class="flex">${RAMPA_AZUL.map(c => `<span class="inline-block w-4 h-3" style="background:${c}"></span>`).join('')}</div>
                            <span>${max} unid.</span>
                            <span class="ml-4 inline-block w-4 h-3 bg-gray-100 rounded-sm"></span><span>asignado sin ventas</span>
                        </div>
                        ${sinVentas.length ? `
                            <div class="mt-4 p-3 bg-orange-50 border border-orange-200 rounded text-sm">
                                <div class="font-bold text-orange-900 mb-1">⚠️ ${sinVentas.length} espacio${sinVentas.length > 1 ? 's' : ''} asignado${sinVentas.length > 1 ? 's' : ''} sin ventas en el período</div>
                                <div class="text-orange-900">${sinVentas.map(x => `${x.e} (${x.p ? esc(x.p.nombre_producto) : '—'})`).join(' · ')}</div>
                            </div>` : ''}
                    </div>`;
            }).join('');

            return `
                <div class="space-y-6">
                    ${renderFiltros(`<span class="text-xs text-gray-500">El período aplica al análisis de espacios. Ventas por mes muestra todo el historial.</span>`)}

                    <!-- VENTAS POR MES -->
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <h3 class="font-bold text-lg mb-1">📅 Ventas por mes · ${esc(nombreFiltroMaquina())}</h3>
                        <p class="text-xs text-gray-500 mb-4">Ventas aprobadas. Los meses con datos incompletos se comparan por <strong>promedio diario</strong>.</p>
                        ${resumen.length ? `
                            <div class="chart-box"><canvas id="chartMeses" aria-label="Ventas por mes"></canvas></div>
                            <div class="overflow-x-auto mt-6">
                                <table class="tabla-resp w-full text-sm">
                                    <thead class="bg-gray-100">
                                        <tr>
                                            <th class="text-left p-2">Mes</th>
                                            <th class="text-right p-2">Días con ventas</th>
                                            <th class="text-right p-2">Transacciones</th>
                                            <th class="text-right p-2">Unidades</th>
                                            ${maqs.length > 1 ? maqs.map(m => `<th class="text-right p-2"><span class="inline-block w-2 h-2 rounded-sm mr-1" style="background:${colorMaquina(m.id)}"></span>${esc(m.nombre)}</th>`).join('') : ''}
                                            <th class="text-right p-2">Venta total</th>
                                            <th class="text-right p-2">Promedio diario</th>
                                            <th class="text-right p-2">Var. prom. diario</th>
                                            <th class="text-right p-2">Ticket prom.</th>
                                            <th class="text-right p-2">Comisión PayScan</th>
                                            <th class="text-right p-2">Ingreso neto</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${resumen.map(r => `
                                            <tr class="border-t">
                                                <td class="p-2 font-semibold whitespace-nowrap">${labelMes(r.ym)}${r.parcial ? `<div class="text-xs font-normal text-gray-500">${fmtFecha(r.desde).substring(0, 5)} al ${fmtFecha(r.hasta).substring(0, 5)} (parcial)</div>` : ''}</td>
                                                <td class="p-2 text-right">${r.nDias}</td>
                                                <td class="p-2 text-right">${r.trx.toLocaleString('es-CL')}</td>
                                                <td class="p-2 text-right">${r.unidades.toLocaleString('es-CL')}</td>
                                                ${maqs.length > 1 ? maqs.map(m => `<td class="p-2 text-right">$${clp((r.porMaquina[m.id] || { monto: 0 }).monto)}</td>`).join('') : ''}
                                                <td class="p-2 text-right font-bold">$${clp(r.monto)}</td>
                                                <td class="p-2 text-right">$${clp(r.promDia)}</td>
                                                <td class="p-2 text-right ${r.varPromDia === null ? 'text-gray-400' : r.varPromDia >= 0 ? 'text-green-700' : 'text-red-700'}">${r.varPromDia === null ? '—' : (r.varPromDia >= 0 ? '▲ ' : '▼ ') + pct(Math.abs(r.varPromDia))}</td>
                                                <td class="p-2 text-right">$${clp(r.ticket)}</td>
                                                <td class="p-2 text-right">$${clp(r.comision)}</td>
                                                <td class="p-2 text-right">$${clp(r.neto)}</td>
                                            </tr>`).join('')}
                                    </tbody>
                                </table>
                            </div>
                        ` : `<p class="text-gray-500 text-sm">Aún no hay ventas importadas.</p>`}
                    </div>

                    <!-- ESPACIOS MÁS VENDIDOS -->
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <h3 class="font-bold text-lg mb-1">🏆 Espacios más vendidos · ${esc(nombreFiltroMaquina())}</h3>
                        <p class="text-xs text-gray-500 mb-4">${esc(rango.label)} · ordenados por venta en $ · total del período <strong>$${clp(totalPeriodo)}</strong>${n80 > 0 ? ` · <strong>${n80} de ${ranking.length} espacios</strong> generan el 80% de la venta` : ''}</p>
                        ${ranking.length ? `
                            <div class="md:hidden divide-y border rounded-xl">
                                ${filasRanking.map((x, i) => `
                                    <div class="flex items-center gap-3 px-3 py-2.5">
                                        <div class="w-7 text-center font-bold text-gray-500">${i + 1}</div>
                                        <div class="flex-1 min-w-0">
                                            <div class="font-semibold text-sm truncate">${x.producto ? esc(x.producto.nombre_producto) : '<span class="text-orange-700">sin asignar</span>'}</div>
                                            <div class="text-xs text-gray-500 flex items-center gap-1"><span class="inline-block w-2 h-2 rounded-sm" style="background:${colorMaquina(x.maquina.id)}"></span>${esc(x.maquina.nombre)} · esp. ${x.espacio} (${bandejaPos(x.espacio)})</div>
                                            <div class="mt-1 bg-gray-100 rounded h-1.5"><div class="h-1.5 rounded" style="width:${Math.max(2, x.pct / (ranking[0].pct || 1) * 100)}%;background:${colorMaquina(x.maquina.id)}"></div></div>
                                        </div>
                                        <div class="text-right flex-shrink-0">

                                        </div>
                                    </div>`).join('')}
                            </div>
                            <div class="hidden md:block overflow-x-auto">
                                <table class="tabla-resp w-full text-sm">
                                    <thead class="bg-gray-100">
                                        <tr>
                                            <th class="text-left p-2">#</th>
                                            <th class="text-left p-2">Máquina</th>
                                            <th class="text-left p-2">Espacio</th>
                                            <th class="text-left p-2">Producto</th>
                                            <th class="text-right p-2">Unidades</th>
                                            <th class="text-right p-2">Transacciones</th>
                                            <th class="text-right p-2">Venta</th>
                                            <th class="text-left p-2 w-40">% de la venta</th>
                                            <th class="text-right p-2">% acumulado</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${filasRanking.map((x, i) => `
                                            <tr class="border-t ${x.pctAcum <= 0.8 || i === 0 ? '' : 'text-gray-600'}">
                                                <td class="p-2 font-bold">${i + 1}</td>
                                                <td class="p-2 whitespace-nowrap"><span class="inline-block w-2 h-2 rounded-sm mr-1" style="background:${colorMaquina(x.maquina.id)}"></span>${esc(x.maquina.nombre)}</td>
                                                <td class="p-2 whitespace-nowrap">${x.espacio} <span class="text-xs text-gray-500">${bandejaPos(x.espacio)}</span></td>
                                                <td class="p-2">${x.producto ? esc(x.producto.nombre_producto) : '<span class="text-orange-700">sin asignar</span>'}</td>
                                                <td class="p-2 text-right font-bold">${x.unidades}</td>
                                                <td class="p-2 text-right">${x.trx}</td>
                                                <td class="p-2 text-right">$${clp(x.monto)}</td>
                                                <td class="p-2">
                                                    <div class="flex items-center gap-2">
                                                        <div class="flex-1 bg-gray-100 rounded h-2"><div class="h-2 rounded" style="width:${Math.max(2, x.pct / (ranking[0].pct || 1) * 100)}%;background:${colorMaquina(x.maquina.id)}"></div></div>
                                                        <span class="text-xs w-12 text-right">${pct(x.pct)}</span>
                                                    </div>
                                                </td>
                                                <td class="p-2 text-right text-xs">${pct(x.pctAcum)}</td>
                                            </tr>`).join('')}
                                    </tbody>
                                </table>
                            </div>
                            ${ranking.length > 15 ? `<button onclick="window.toggleVerTodosEspacios()" class="mt-3 text-sm text-blue-700 underline">${verTodos ? 'Ver solo los 15 primeros' : `Ver los ${ranking.length} espacios`}</button>` : ''}
                        ` : `<p class="text-gray-500 text-sm">Sin ventas en este período.</p>`}
                    </div>

                    <!-- MAPA DE CALOR POR MÁQUINA -->
                    ${mapas}
                </div>
            `;
        }

        function renderProductFields(familiasForm, isEdit) {

            const field = (label, html) => `<label class="flex flex-col gap-1 text-xs font-bold text-gray-600">${label}${html}</label>`;
            return `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    ${field('Nombre producto', `<input type="text" placeholder="Nombre Producto" value="${esc(np.nombre_producto)}" oninput="window.updateNewProduct('nombre_producto', this.value)" class="border p-3 rounded font-normal text-sm">`)}
                    ${field('Familia', `<select onchange="window.updateNewProduct('familia', this.value)" class="border p-3 rounded font-normal text-sm">

        function renderAsignaciones() {

                            ${state.maquinas.map(maquina => {
                                const asignacionesMaquina = state.asignaciones.filter(a => String(a.maquina_id) === String(maquina.id));
                                return `
                                    <div class="bg-white p-6 rounded-lg shadow cursor-pointer hover:shadow-xl transition-all border-2 border-transparent hover:border-blue-500" onclick="window.selectMachineForAssignment('${maquina.id}')">
                                        <h3 class="font-bold text-lg mb-2">📍 ${esc(maquina.nombre)}</h3>
                                        <p class="text-sm text-gray-600 mb-4">${esc(maquina.ubicacion)}</p>
                                        <div class="bg-gradient-to-r from-blue-50 to-blue-100 p-3 rounded text-sm">
                                            <div><strong>${asignacionesMaquina.length}</strong> espacios asignados</div>
                                            <div><strong>${maquina.total_filas || 6} bandejas</strong> × <strong>${maquina.total_columnas || 10} posiciones</strong></div>
                                            <div class="mt-2">Click para gestionar →</div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

            const maquina = state.maquinas.find(m => String(m.id) === String(state.selectedMachineForAssignment));
            if (!maquina) return '<div>Máquina no encontrada</div>';

            const filas = maquina.total_filas || 6;
            const columnas = maquina.total_columnas || 10;
            const asignacionesMaquina = state.asignaciones.filter(a => String(a.maquina_id) === String(maquina.id));
            const ventasPorEspacio = getVentasHoyPorEspacio(maquina.id);
            const ventasHoyMaquina = Object.values(ventasPorEspacio).reduce((acc, v) => ({ count: acc.count + v.count, unidades: acc.unidades + v.unidades, monto: acc.monto + v.monto }), { count: 0, unidades: 0, monto: 0 });
            // Ventas en espacios sin producto asignado = algo no cuadra (asignación faltante o espacio mal configurado)
            const ventasSinAsignar = Object.keys(ventasPorEspacio).filter(e => !asignacionesMaquina.some(a => normEspacio(a.espacio) === e));

            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-2xl font-bold">📍 ${esc(maquina.nombre)}</h2>
                            <p class="text-gray-600">${esc(maquina.ubicacion)}</p>
                        </div>
                        <button onclick="window.closeMachineAssignmentModal()" class="bg-gray-600 text-white px-6 py-3 rounded hover:bg-gray-700 font-bold">
                            ← Volver
                        </button>
                    </div>

                    <div class="bg-white p-6 rounded-lg shadow">
                        <h3 class="text-lg font-bold mb-4">🎯 Grid de Asignaciones (${filas} bandejas × ${columnas} posiciones)</h3>
                        <p class="text-sm text-gray-600 mb-6">Toca un espacio para asignar el producto, la cantidad y la capacidad</p>

                        <div class="overflow-x-auto">
                            <div class="inline-block min-w-full">
                                ${Array.from({ length: filas }).map((_, filaIdx) => `
                                    <div class="flex gap-1 mb-1">
                                        <div class="w-12 sm:w-16 flex-shrink-0 sticky left-0 z-10 bg-white flex items-center justify-center font-bold text-gray-600 text-xs text-center">B${filaIdx + 1}</div>
                                        ${Array.from({ length: columnas }).map((_, colIdx) => {
                                            const espacio = codigoEspacio(filaIdx + 1, colIdx + 1);
                                            const assignment = asignacionesMaquina.find(a => normEspacio(a.espacio) === espacio);
                                            const vendidosHoy = (ventasPorEspacio[espacio] || { unidades: 0 }).unidades;
                                            const product = assignment ? state.inventario.find(p => String(p.sku) === String(assignment.sku)) : null;
                                            
                                            return `
                                                <button type="button" class="grid-cell-large ${assignment ? 'occupied-lg' : 'empty-lg'}"
                                                     onclick="window.openEditAssignmentModal('${esc(maquina.id)}', '${espacio}')">
                                                    <div class="text-center">
                                                        <div class="text-xs font-bold ${assignment ? 'text-blue-100' : 'text-gray-500'} mb-1">${espacio}</div>
                                                        ${assignment ? `
                                                            <div class="text-xs font-bold leading-tight line-clamp-2 break-words">${esc(String(product ? product.nombre_producto : assignment.sku + ' (sin stock)'))}</div>
                                                            <div class="text-lg font-bold text-white">${Number(assignment.cantidad_asignada) || 0}${capacidadEspacio(maquina, espacio) ? `<span class="text-xs font-normal text-blue-100">/${capacidadEspacio(maquina, espacio)}</span>` : ''}</div>
                                                        ` : `
                                                            <div class="text-xs text-gray-400">Vacío</div>
                                                        `}
                                                        ${vendidosHoy ? `<div class="mt-1 text-[10px] font-bold px-2 py-0.5 rounded-full ${assignment ? 'bg-white text-blue-700' : 'bg-orange-100 text-orange-800'}">${vendidosHoy} vend.</div>` : ''}
                                                    </div>
                                                </button>
                                            `;
                                        }).join('')}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="mt-6 p-4 bg-blue-50 rounded border border-blue-200">
                            <div class="text-sm">
                                <div class="font-bold mb-2">📊 Resumen:</div>
                                <div>Total espacios: <strong>${filas * columnas}</strong></div>
                                <div>Espacios asignados: <strong>${asignacionesMaquina.length}</strong></div>
                                <div>Espacios vacíos: <strong>${filas * columnas - asignacionesMaquina.length}</strong></div>
                                <div class="mt-2">Ocupación: <strong>${Math.round((asignacionesMaquina.length / (filas * columnas)) * 100)}%</strong></div>
                                ${(() => {
                                    const stock = asignacionesMaquina.reduce((t, a) => t + (Number(a.cantidad_asignada) || 0), 0);
                                    const cap = asignacionesMaquina.reduce((t, a) => t + (capacidadEspacio(maquina, a.espacio) || 0), 0);
                                    const faltan = asignacionesMaquina.reduce((t, a) => { const c = capacidadEspacio(maquina, a.espacio); return t + (c ? Math.max(0, c - (Number(a.cantidad_asignada) || 0)) : 0); }, 0);

                            </div>

                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

            { id: 'inventario', label: 'Inventario', largo: 'Inventario', icono: 'inventario' },
            { id: 'asignaciones', label: 'Espacios', largo: 'Asignaciones', icono: 'espacios' },
            { id: 'maquinas', label: 'Máquinas', largo: 'Máquinas', icono: 'maquinas' },
            { id: 'historial', label: 'Historial', largo: 'Historial', icono: 'historial', soloEscritorio: true }
        ];

        // En celular, cada celda de tabla recibe el nombre de su columna (para mostrarse como tarjeta)
        function etiquetarTablas(raiz) {
            raiz.querySelectorAll('table.tabla-resp').forEach(t => {
                const titulos = Array.from(t.querySelectorAll('thead th')).map(th => th.textContent.trim());
                t.querySelectorAll('tbody tr').forEach(tr => {
                    Array.from(tr.children).forEach((td, i) => { if (!td.hasAttribute('data-label')) td.setAttribute('data-label', td.colSpan > 1 ? '' : (titulos[i] || '')); });
                });
            });
        }

        function renderLoginScreen() {
            const bloqueado = state.loginBlockedUntil > Date.now();
            return `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-blue-900 p-4">
                    <form class="bg-white rounded-lg shadow-xl max-w-md w-full p-8" onsubmit="event.preventDefault(); window.handleLogin();" autocomplete="on">
                        <div class="text-center mb-6">
                            <div class="text-6xl mb-3">📦</div>
                            <h1 class="text-2xl font-bold">GO BOX Dashboard</h1>
                            <p class="text-gray-600 text-sm">Acceso restringido</p>
                        </div>

                        <div class="space-y-4">
                            <label class="block text-sm font-bold text-gray-700">Correo
                                <input type="email" id="loginEmail" name="email" autocomplete="username" required
                                    value="${esc(state.loginForm.email)}" oninput="window.updateLoginField('email', this.value)"
                                    class="mt-1 w-full border p-3 rounded font-normal focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </label>
                            <label class="block text-sm font-bold text-gray-700">Contraseña
                                <input type="password" id="loginPassword" name="password" autocomplete="current-password" required
                                    value="" oninput="window.updateLoginField('password', this.value)"
                                    class="mt-1 w-full border p-3 rounded font-normal focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </label>
                            ${state.loginError ? `<div class="bg-red-50 border border-red-300 text-red-800 text-sm p-3 rounded" role="alert">${esc(state.loginError)}${state.loginDetalle ? `<div class="mt-1 text-xs text-red-600 font-mono break-all">Detalle: ${esc(state.loginDetalle)}</div>` : ''}</div>` : ''}
                            <button type="submit" ${state.loginLoading || bloqueado ? 'disabled' : ''} class="w-full bg-blue-600 text-white py-3 rounded hover:bg-blue-700 font-bold disabled:opacity-60 disabled:cursor-not-allowed">
                                ${state.loginLoading ? 'Verificando…' : 'Ingresar'}
                            </button>
                        </div>

                        <p class="text-xs text-gray-500 text-center mt-4">Las cuentas se crean desde Supabase. Si olvidaste tu contraseña, pide que te la restablezcan.</p>
                        <p class="text-xs text-center mt-2"><button type="button" onclick="window.limpiarSesionGuardada()" class="text-blue-700 underline">¿Problemas para entrar? Limpiar sesión guardada</button></p>
                    </form>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');

            if (state.loading) {
                app.innerHTML = `
                    <div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-600 to-blue-800">
                        <div class="text-white text-center">
                            <div class="text-6xl mb-4 animate-bounce">📦</div>
                            <div class="text-2xl font-bold">GO BOX Dashboard</div>
                            <div class="text-sm mt-2 opacity-80">Cargando datos...</div>
                        </div>
                    </div>
                `;
                return;
            }

            // Sin sesión: solo se muestra el login (el dashboard ni siquiera se dibuja detrás)
            if (!state.session && !state.demoMode) {
                app.innerHTML = renderLoginScreen();
                const campo = document.getElementById(state.loginForm.email ? 'loginPassword' : 'loginEmail');
                if (campo) campo.focus();
                return;
            }

            const contentMap = {
                dashboard: renderDashboard,
                inventario: renderInventario,
                asignaciones: renderAsignaciones,
                historial: renderHistorial,
                maquinas: renderMaquinas,
                analytics: renderAnalytics,
            };

            // Un error en una pestaña ya no deja la pantalla en blanco
            let content;
            try {
                content = (contentMap[state.activeTab] || renderDashboard)();
            } catch (err) {
                console.error('Error renderizando pestaña:', err);
                content = `<div class="bg-red-50 border border-red-300 text-red-800 p-6 rounded-lg">❌ Error al mostrar esta sección: ${esc(err.message)}</div>`;
            }

            // Guardar foco y cursor antes de redibujar (antes al escribir en la búsqueda o formularios se perdía el foco)
            const active = document.activeElement;
            let focusInfo = null;
            if (active && app.contains(active) && /^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName)) {
                const fields = Array.from(app.querySelectorAll('input, select, textarea'));
                focusInfo = { index: fields.indexOf(active), id: active.id };
                try { focusInfo.start = active.selectionStart; focusInfo.end = active.selectionEnd; } catch (e) {}
            }

            app.innerHTML = `
                <div class="min-h-screen bg-gray-50">
                    <header class="app-header bg-gradient-to-r from-blue-700 to-blue-900 text-white shadow-md sticky top-0 z-40">
                        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center gap-3">
                            <div class="flex items-center gap-2.5 min-w-0">
                                <div class="w-9 h-9 rounded-xl bg-white/15 flex items-center justify-center flex-shrink-0">${icono('logo', 'w-5 h-5')}</div>
                                <div class="min-w-0">
                                    <div class="logo leading-none" style="font-size:1.25rem"><span class="logo-go">GO</span><span class="logo-box" style="color:#93c5fd">BOX</span></div>
                                    <div class="text-[11px] opacity-80 truncate">${esc(NAV.find(n => n.id === state.activeTab)?.largo || 'Tu Tienda 24/7')}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="user-email text-sm opacity-90 hidden md:inline mr-1">${esc(state.currentUser)}</span>
                                <button onclick="window.setTab('historial')" class="icon-btn md:hidden" aria-label="Historial">${icono('historial', 'w-5 h-5')}</button>
                                <button onclick="window.fetchAllData()" class="icon-btn" aria-label="Actualizar datos" title="Actualizar">${icono('actualizar', 'w-5 h-5')}</button>
                                <button onclick="window.handleLogout()" class="icon-btn" aria-label="Cerrar sesión" title="Cerrar sesión">${icono('salir', 'w-5 h-5')}</button>
                            </div>
                        </div>
                    </header>

                    ${state.demoMode ? `
                        <div class="bg-yellow-100 border-b border-yellow-300 text-yellow-900 text-sm text-center py-2 px-4">
                            ⚠️ Modo demo: datos de ejemplo, los cambios no se guardan.
                        </div>
                    ` : ''}
                    ${state.loadError ? `
                        <div class="bg-red-50 border-b border-red-200 text-red-900 text-sm px-4 py-3" role="alert">
                            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
                                <div><strong>${esc(state.loadError)}</strong>${state.loadErrorDetalle ? `<div class="text-xs font-mono text-red-700 break-all mt-1">${esc(state.loadErrorDetalle)}</div>` : ''}</div>
                                <button onclick="window.fetchAllData()" class="bg-red-600 text-white px-4 py-2 rounded-lg font-semibold text-sm">Reintentar</button>
                            </div>
                        </div>
                    ` : ''}

                    <main class="app-main max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-6">
                        <nav class="nav-top flex gap-1 mb-6 overflow-x-auto border-b" aria-label="Secciones">
                            ${NAV.map(n => `
                                <button onclick="window.setTab('${n.id}')" class="tab-btn ${state.activeTab === n.id ? 'active' : ''} flex items-center gap-2 px-4 py-3 border-b-2 font-semibold whitespace-nowrap text-gray-600" ${state.activeTab === n.id ? 'aria-current="page"' : ''}>
                                    ${icono(n.icono, 'w-5 h-5')} ${n.largo}
                                </button>`).join('')}
                        </nav>

                        ${content}
                    </main>

                    <nav class="nav-bottom" aria-label="Navegación principal">
                        ${NAV.filter(n => !n.soloEscritorio).map(n => `
                            <button onclick="window.setTab('${n.id}')" class="${state.activeTab === n.id ? 'active' : ''}" ${state.activeTab === n.id ? 'aria-current="page"' : ''}>
                                ${icono(n.icono, 'w-6 h-6')}<span>${n.label}</span>
                            </button>`).join('')}
                    </nav>

                    <footer class="app-footer bg-gray-900 text-white text-center py-6 mt-12">
                        <div>GO BOX Dashboard v5.0 | Concepción, Chile 🇨🇱</div>
                    </footer>
                </div>

                ${state.showScannerModal ? renderScannerModal() : ''}
                ${state.showEditProductModal ? renderEditProductModal() : ''}
                ${state.showEditAssignmentModal ? renderEditAssignmentModal() : ''}
                ${state.showImportModal ? renderImportModal() : ''}
                ${state.showInvModal ? renderInventarioModal() : ''}
            `;

            etiquetarTablas(app);

            // Restaurar foco y cursor
            if (focusInfo) {
                const fields = Array.from(app.querySelectorAll('input, select, textarea'));
                const target = (focusInfo.id && document.getElementById(focusInfo.id)) || fields[focusInfo.index];
                if (target) {
                    target.focus();
                    try { if (focusInfo.start !== null && focusInfo.start !== undefined) target.setSelectionRange(focusInfo.start, focusInfo.end); } catch (e) {}
                }
            }

            // Inicializar gráficos cuando estamos en dashboard (con instancias previas destruidas en initCharts)
            if (state.activeTab === 'dashboard' || state.activeTab === 'analytics') {
                setTimeout(() => window.initCharts(), 50);
            }
        }

        window.addEventListener('load', iniciarApp);
    </script>
</body>
</html>
