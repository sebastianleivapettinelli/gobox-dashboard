<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GO BOX Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
    <style>
        * { scrollbar-width: thin; }
        .stat-card { transition: transform 0.2s, box-shadow 0.2s; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .tab-btn.active { border-bottom-color: #2563eb; color: #2563eb; }
        .tab-btn { border-bottom-color: transparent; }
        .logo { font-weight: 900; font-size: 1.5rem; letter-spacing: -0.05em; }
        .logo-go { color: white; }
        .logo-box { color: #3b82f6; }
        #scanner { width: 100%; max-width: 500px; }
        .scanner-overlay { position: relative; width: 100%; max-width: 500px; margin: 0 auto; }
        .scanner-overlay::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 100px;
            border: 2px solid #ef4444;
            border-radius: 10px;
            pointer-events: none;
            box-shadow: inset 0 0 20px rgba(239, 68, 68, 0.3);
        }
        .grid-cell-large { aspect-ratio: 1; border: 2px solid #e5e7eb; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; text-align: center; padding: 8px; cursor: pointer; border-radius: 6px; transition: all 0.2s; min-width: 80px; min-height: 80px; }
        .grid-cell-large.occupied-lg { background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%); color: white; font-weight: bold; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
        .grid-cell-large.empty-lg { background: #f9fafb; border-color: #d1d5db; color: #9ca3af; }
        .grid-cell-large:hover { box-shadow: 0 8px 16px rgba(0,0,0,0.15); transform: translateY(-2px); }
        .alert-item { padding: 12px; border-left: 4px solid; border-radius: 4px; margin-bottom: 8px; }
        .alert-red { background: #fee2e2; border-color: #dc2626; }
        .alert-yellow { background: #fef3c7; border-color: #f59e0b; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app"></div>

    <script>
        const SUPABASE_URL = 'https://ghbcghqulpvukmuatuck.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoYmNnaHF1bHB2dWttdWF0dWNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDQ5MjMsImV4cCI6MjEwNTU4MDkyM30.LyBnSnQ4FrCe32ves6Ys9mzT-D2P3Ase-_cgaEaWBjk';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const state = {

            gastos: [],
            loading: true,

            editingAssignmentSpace: null,

            newAssignment: {
                maquina_id: '',
                espacio: '',

                cantidad_asignada: 1,

            },

            },

            },

                precio_compra_unitario: '',
                precio_venta_unitario: '',
                cantidad_actual: '',
                fecha_compra: new Date().toISOString().split('T')[0],
                fecha_caducidad: '',

            },
            newMachine: {
                nombre: '',
                serial_amit: '',
                ubicacion: '',

            }
        };

        // Cargar usuario guardado
        if (localStorage.getItem('gobox_user')) {
            state.currentUser = localStorage.getItem('gobox_user');
        }


        async function fetchAllData() {
            state.loading = true;
            render();
            try {
                await Promise.allSettled([
                    fetchVentas(),
                    fetchInventario(),
                    fetchAsignaciones(),
                    fetchMaquinas(),
                    fetchHistorial(),
                    fetchInventarioInicial(),
                    fetchGastos()
                ]);
                            } catch (err) {
                console.error('Error cargando datos:', err);
                            } finally {
                state.loading = false;
                render();
                if (state.activeTab === 'dashboard') {
                    setTimeout(() => { if (window.initCharts) window.initCharts(); }, 100);
                }
            }
        }

        async function fetchVentas() {
            try {
                const { data, error } = await supabaseClient.from('ventas_payscan').select('*').order('timestamp_completo', { ascending: false }).limit(50);
                if (error) throw error;
                state.ventas = data || [];
            } catch (err) {
                console.warn('⚠️ No se pudo conectar con ventas:', err.message);
                state.ventas = [];
            }
        }

        async function fetchInventario() {
            const { data, error } = await supabaseClient.from('inventario_bodega').select('*').order('fecha_caducidad', { ascending: true });
            if (error) {
                console.error('Error fetching inventario:', error.message || JSON.stringify(error));
                if (!state.error) state.error = 'inventario_bodega: ' + (error.message || JSON.stringify(error));
            }
            else state.inventario = data || [];
        }

        async function fetchAsignaciones() {
            const { data, error } = await supabaseClient.from('asignaciones_maquina').select('*');
            if (error) {
                console.error('Error fetching asignaciones:', error.message || JSON.stringify(error));
                if (!state.error) state.error = 'asignaciones_maquina: ' + (error.message || JSON.stringify(error));
            }
            else state.asignaciones = data || [];
        }

        async function fetchMaquinas() {
            try {
                const { data, error } = await supabaseClient.from('maquinas').select('*');
                if (error) throw error;
                state.maquinas = data || [];
                console.log('✅ Máquinas cargadas desde Supabase:', state.maquinas.length);
            } catch (err) {
                console.error('❌ Error fetching maquinas:', err.message);
                // FALLBACK: Datos mock si Supabase falla
                state.maquinas = [
                    { id: 'MAQ-001', nombre: 'Parque Lomas', serial_amit: 0, ubicacion: 'San Pedro de la Paz', total_espacios: 60, total_filas: 7, total_columnas: 5 },
                    { id: 'MAQ-002', nombre: 'Edificio New', serial_amit: 440864, ubicacion: 'Concepción', total_espacios: 48, total_filas: 7, total_columnas: 5 }
                ];
                console.log('⚠️ Usando fallback mock data para máquinas');
            }
        }

        async function fetchHistorial() {
            const stored = localStorage.getItem('gobox_historial');
            state.historial = stored ? JSON.parse(stored) : [];
        }

        function guardarHistorial(accion, detalles) {
            const registro = {
                timestamp: new Date().toISOString(),
                usuario: state.currentUser,
                accion: accion,
                detalles: detalles
            };
            state.historial.unshift(registro);
            localStorage.setItem('gobox_historial', JSON.stringify(state.historial.slice(0, 100)));
        }

        // ============================================
        // FETCH FASE 3
        // ============================================
        async function fetchInventarioInicial() {
            try {
                const { data, error } = await supabaseClient.from('inventario_inicial').select('*').order('created_at', { ascending: false });
                if (error) {
                    console.warn('⚠️ No se pudo conectar con inventario_inicial:', error.message);
                    state.inventario_inicial = [];
                } else {
                    state.inventario_inicial = data || [];
                }
            } catch (err) {
                console.warn('⚠️ Error fetchInventarioInicial:', err.message);
                state.inventario_inicial = [];
            }
        }

        async function fetchGastos() {
            try {
                const { data, error } = await supabaseClient.from('gastos').select('*').order('fecha', { ascending: false });
                if (error) {
                    console.warn('⚠️ No se pudo conectar con gastos:', error.message);
                    state.gastos = [];
                } else {
                    state.gastos = data || [];
                }
            } catch (err) {
                console.warn('⚠️ Error fetchGastos:', err.message);
                state.gastos = [];
            }
        }

        window.saveGasto = async function() {
            const fecha = document.getElementById('gasto_fecha')?.value;
            const categoria = document.getElementById('gasto_categoria')?.value;
            const descripcion = document.getElementById('gasto_descripcion')?.value;
            const monto_neto = parseFloat(document.getElementById('gasto_monto_neto')?.value || 0);
            
            if (!fecha || !categoria || !monto_neto) {
                alert('⚠️ Completa fecha, categoría y monto');
                return;
            }

            const iva = monto_neto * 0.19;
            const monto_total = monto_neto + iva;

            try {
                const { error } = await supabaseClient.from('gastos').insert([{
                    fecha: fecha,
                    categoria: categoria,
                    descripcion: descripcion,
                    monto_neto: monto_neto,
                    iva: iva,
                    monto_total: monto_total,
                    maquina_id: null,
                    facturas_urls: []
                }]);

                if (error) {
                    console.error('Error:', error);
                    alert('❌ Error al guardar gasto: ' + error.message);
                } else {
                    alert('✅ Gasto guardado correctamente');
                    guardarHistorial('CREAR_GASTO', `${categoria}: $${monto_total.toLocaleString('es-CL')}`);
                    // Limpiar formulario
                    document.getElementById('gasto_fecha').value = new Date().toISOString().split('T')[0];
                    document.getElementById('gasto_categoria').value = 'Arriendo';
                    document.getElementById('gasto_descripcion').value = '';
                    document.getElementById('gasto_monto_neto').value = '';
                    await fetchGastos();
                    render();
                }
            } catch (err) {
                console.error('Error inesperado:', err);
                alert('💥 Error: ' + err.message);
            }
        }

        // ============================================
        // LOGIN
        // ============================================
        window.handleLogin = function() {
            if (state.loginForm.usuario && state.loginForm.contraseña) {
                state.currentUser = state.loginForm.usuario;
                localStorage.setItem('gobox_user', state.loginForm.usuario);
                state.showLoginModal = false;
                state.loginForm = { usuario: '', contraseña: '' };
                guardarHistorial('LOGIN', `Usuario: ${state.currentUser}`);
                render();
            } else {
                alert('Completa usuario y contraseña');
            }
        };

        window.handleLogout = function() {
            if (confirm('¿Cerrar sesión?')) {
                state.currentUser = '';
                localStorage.removeItem('gobox_user');
                state.showLoginModal = true;
                state.loginForm = { usuario: '', contraseña: '' };
                guardarHistorial('LOGOUT', 'Sesión cerrada');
                render();
            }
        };

        // ============================================
        // EDITAR PRODUCTO
        // ============================================
        window.openEditProductModal = function(productId) {
            const product = state.inventario.find(p => p.id === productId);
            if (product) {
                state.editingProduct = product;
                state.newProduct = { ...product };
                state.showEditProductModal = true;
                render();
            }
        };

        window.closeEditProductModal = function() {
            state.editingProduct = null;
            state.showEditProductModal = false;
            state.newProduct = { sku: '', nombre_producto: '', familia: 'Snacks', precio_compra_unitario: '', precio_venta_unitario: '', cantidad_actual: '', fecha_compra: new Date().toISOString().split('T')[0], fecha_caducidad: '', proveedor: '' };
            render();
        };

        window.saveProductChanges = async function() {
            if (!state.newProduct.sku || !state.newProduct.nombre_producto) {
                alert('SKU y nombre son requeridos');
                return;
            }

            const { error } = await supabaseClient.from('inventario_bodega').update({
                nombre_producto: state.newProduct.nombre_producto,
                familia: state.newProduct.familia,
                precio_compra_unitario: parseFloat(state.newProduct.precio_compra_unitario) || 0,
                precio_venta_unitario: parseFloat(state.newProduct.precio_venta_unitario) || 0,
                cantidad_actual: parseInt(state.newProduct.cantidad_actual) || 0,
                fecha_caducidad: state.newProduct.fecha_caducidad,
                proveedor: state.newProduct.proveedor
            }).eq('id', state.editingProduct.id);

            if (error) { console.error('Error:', error); alert('Error al guardar'); }
            else {
                guardarHistorial('EDITAR_PRODUCTO', `SKU: ${state.newProduct.sku}`);
                alert('✅ Producto actualizado');
                state.showEditProductModal = false;
                await fetchInventario();
                render();
            }
        };

        window.selectMachineForAssignment = function(machineId) {
            state.selectedMachineForAssignment = machineId;
            render();
        };

        window.closeMachineAssignmentModal = function() {
            state.selectedMachineForAssignment = null;
            render();
        };

        // ============================================
        // ============================================
        window.openEditAssignmentModal = function(machineId, espacio) {
            state.selectedMachineForAssignment = machineId;
            state.editingAssignmentSpace = espacio;
            const assignment = state.asignaciones.find(a => a.maquina_id === machineId && a.espacio === espacio);
            state.newAssignment = {
                maquina_id: machineId,
                espacio: espacio,
                sku: assignment ? assignment.sku : '',
                cantidad_asignada: assignment ? assignment.cantidad_asignada : 1
            };
            state.showEditAssignmentModal = true;
            render();
        };

        window.closeEditAssignmentModal = function() {
            state.showEditAssignmentModal = false;
            state.editingAssignmentSpace = null;
            state.newAssignment = { maquina_id: '', espacio: '', sku: '', cantidad_asignada: 1 };
            render();
        };

        window.updateAssignmentField = function(field, value) {
            if (field === 'cantidad_asignada' || field === 'productos_por_slot') {
                state.newAssignment[field] = parseInt(value) || 1;
            } else {
                state.newAssignment[field] = value;
            }
            render();
        };

        window.saveAssignment = async function() {
            if (!state.newAssignment.sku) {
                alert('⚠️ Debes seleccionar un producto');
                return;
            }

            const product = state.inventario.find(p => p.sku === state.newAssignment.sku);
            if (!product) {
                alert('⚠️ Producto no encontrado');
                return;
            }

            try {
                const existingAssignment = state.asignaciones.find(
                    a => a.maquina_id === state.newAssignment.maquina_id && 
                         a.espacio === state.newAssignment.espacio
                );

                if (existingAssignment) {
                    // Actualizar
                    const { error } = await supabaseClient.from('asignaciones_maquina').update({
                        sku: state.newAssignment.sku,
                        cantidad_asignada: state.newAssignment.cantidad_asignada,
                        precio_venta_espacio: product.precio_venta_unitario,
                        productos_por_slot: state.newAssignment.productos_por_slot
                    }).eq('id', existingAssignment.id);

                    if (error) {
                        console.error('Error:', error);
                        alert('❌ Error al actualizar: ' + error.message);
                    } else {
                        guardarHistorial('ACTUALIZAR_ASIGNACION', `Máquina: ${state.newAssignment.maquina_id}, Espacio: ${state.newAssignment.espacio}, Producto: ${state.newAssignment.sku}, Cantidad: ${state.newAssignment.cantidad_asignada}`);
                        alert('✅ Asignación actualizada');
                        await fetchAsignaciones();
                        state.showEditAssignmentModal = false;
                        render();
                    }
                } else {
                    // Crear nueva
                    const { error } = await supabaseClient.from('asignaciones_maquina').insert([{
                        maquina_id: state.newAssignment.maquina_id,
                        espacio: state.newAssignment.espacio,
                        sku: state.newAssignment.sku,
                        cantidad_asignada: state.newAssignment.cantidad_asignada,
                        precio_venta_espacio: product.precio_venta_unitario,
                        productos_por_slot: state.newAssignment.productos_por_slot
                    }]);

                    if (error) {
                        console.error('Error:', error);
                        alert('❌ Error al crear: ' + error.message);
                    } else {
                        guardarHistorial('CREAR_ASIGNACION', `Máquina: ${state.newAssignment.maquina_id}, Espacio: ${state.newAssignment.espacio}, Producto: ${state.newAssignment.sku}, Cantidad: ${state.newAssignment.cantidad_asignada}`);
                        alert('✅ Asignación creada');
                        await fetchAsignaciones();
                        state.showEditAssignmentModal = false;
                        render();
                    }
                }
            } catch (err) {
                console.error('Error:', err);
                alert('💥 Error inesperado: ' + err.message);
            }
        };

        window.deleteAssignmentFromModal = async function() {
            if (!confirm('¿Eliminar esta asignación?')) return;

            const assignment = state.asignaciones.find(
                a => a.maquina_id === state.newAssignment.maquina_id && 
                     a.espacio === state.newAssignment.espacio
            );

            if (!assignment) {
                alert('Asignación no encontrada');
                return;
            }

            try {
                const { error } = await supabaseClient.from('asignaciones_maquina').delete().eq('id', assignment.id);

                if (error) {
                    console.error('Error:', error);
                    alert('❌ Error al eliminar: ' + error.message);
                } else {
                    guardarHistorial('ELIMINAR_ASIGNACION', `Máquina: ${state.newAssignment.maquina_id}, Espacio: ${state.newAssignment.espacio}`);
                    alert('✅ Asignación eliminada');
                    await fetchAsignaciones();
                    state.showEditAssignmentModal = false;
                    render();
                }
            } catch (err) {
                console.error('Error:', err);
                alert('💥 Error inesperado: ' + err.message);
            }
        };

        // ============================================
        // BÚSQUEDA Y FILTROS
        // ============================================
        window.updateSearchQuery = function(value) {
            state.searchQuery = value.toLowerCase();
            render();
        };

        window.updateFilter = function(filterType, value) {
            if (filterType === 'familia') state.filterFamilia = value;
            if (filterType === 'proveedor') state.filterProveedor = value;
            if (filterType === 'estado') state.filterEstado = value;
            render();
        };

        function getFilteredInventario() {
            return state.inventario.filter(p => {
                const matchSearch = !state.searchQuery || p.sku.toLowerCase().includes(state.searchQuery) || p.nombre_producto.toLowerCase().includes(state.searchQuery);
                const matchFamilia = state.filterFamilia === 'Todos' || p.familia === state.filterFamilia;
                const matchProveedor = state.filterProveedor === 'Todos' || p.proveedor === state.filterProveedor;
                
                let matchEstado = true;
                if (state.filterEstado === 'Bajo Stock') matchEstado = p.cantidad_actual < 5;
                else if (state.filterEstado === 'Por Vencer') {
                    const venc = new Date(p.fecha_caducidad);
                    const hoy = new Date();
                    const dias = (venc - hoy) / (1000 * 60 * 60 * 24);
                    matchEstado = dias < 30 && dias > 0;
                }

                return matchSearch && matchFamilia && matchProveedor && matchEstado;
            });
        }

        // ============================================
        // REPORTES
        // ============================================
        window.exportarInventarioCSV = function() {
            const filtered = getFilteredInventario();
            let csv = 'SKU,Nombre,Familia,Cantidad,Precio Compra,Precio Venta,Vencimiento,Proveedor\n';
            
            filtered.forEach(p => {
                csv += `"${p.sku}","${p.nombre_producto}","${p.familia}",${p.cantidad_actual},${p.precio_compra_unitario},${p.precio_venta_unitario},"${p.fecha_caducidad}","${p.proveedor}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `inventario_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            guardarHistorial('EXPORTAR_CSV', `${filtered.length} productos`);
        };

        // ============================================
        // SCANNER (igual que v4)
        // ============================================
        window.openScannerModal = function() {
            state.showScannerModal = true;
            state.detectedBarcode = null;
            state.scannedProductData = null;
            render();
            setTimeout(() => { initializeScanner(); }, 100);
        };

        window.closeScannerModal = function() {
            stopScanner();
            state.showScannerModal = false;
            state.detectedBarcode = null;
            state.scannedProductData = null;
            render();
        };

        window.confirmScannedProduct = function() {
            if (state.scannedProductData) {
                state.newProduct = {
                    sku: state.detectedBarcode,
                    nombre_producto: state.scannedProductData.nombre_producto || '',
                    familia: state.scannedProductData.familia || 'Snacks',
                    precio_compra_unitario: state.scannedProductData.precio_compra_unitario || '',
                    precio_venta_unitario: state.scannedProductData.precio_venta_unitario || '',
                    cantidad_actual: '',
                    fecha_compra: new Date().toISOString().split('T')[0],
                    fecha_caducidad: '',
                    proveedor: state.scannedProductData.proveedor || '',
                };
                state.showScannerModal = false;
                state.showNewProductForm = true;
                state.activeTab = 'inventario';
                stopScanner();
                render();
            }
        };

        function initializeScanner() {
            if (state.scannerActive) return;
            state.scannerActive = true;
            const scanner = document.getElementById('scanner');
            if (!scanner) return;

            Quagga.init({
                inputStream: {
                    name: 'Live',
                    type: 'LiveStream',
                    target: scanner,
                    constraints: { width: { min: 300 }, height: { min: 300 }, facingMode: 'environment' }
                },
                decoder: {
                    workers: 2,
                    debug: true,
                    multiple: false,
                    readers: ['ean_reader', 'upc_reader', 'code128_reader', 'code39_reader']
                }
            }, function(err) {
                if (err) {
                    console.error('Quagga init error:', err);
                    alert('Error al acceder a la cámara');
                    state.scannerActive = false;
                    return;
                }
                Quagga.start();
                Quagga.onDetected(function(result) {
                    if (result.codeResult && result.codeResult.code) {
                        const barcode = result.codeResult.code;
                        state.detectedBarcode = barcode;
                        const existingProduct = state.inventario.find(p => p.sku === barcode);
                        state.scannedProductData = existingProduct || { sku: barcode, nombre_producto: '', familia: 'Snacks', proveedor: '' };
                        render();
                        Quagga.stop();
                        state.scannerActive = false;
                    }

        function getVentasHoy() {
            const hoy = new Date().toISOString().split('T')[0];
            return state.ventas.filter(v => v.fecha === hoy);
        }

        function getTotalVentasHoy() {
            return getVentasHoy().reduce((sum, v) => sum + parseFloat(v.monto_venta || 0), 0);
        }

        function getTransaccionesHoy() {
            return getVentasHoy().length;
        }

        function getTicketPromedio() {
            const ventasHoy = getVentasHoy();
            if (ventasHoy.length === 0) return 0;
            return getTotalVentasHoy() / ventasHoy.length;
        }

        function getVentasAyer() {
            const ayer = new Date(Date.now() - 86400000).toISOString().split('T')[0];
            return state.ventas.filter(v => v.fecha === ayer);
        }

        function getTotalVentasAyer() {
            return getVentasAyer().reduce((sum, v) => sum + parseFloat(v.monto_venta || 0), 0);
        }

        function getComparativaHoyVsAyer() {
            const hoy = getTotalVentasHoy();
            const ayer = getTotalVentasAyer();
            if (ayer === 0) return { porcentaje: 0, estado: 'sin_comparar', monto_hoy: hoy, monto_ayer: ayer };
            const cambio = ((hoy - ayer) / ayer) * 100;
            return {
                porcentaje: cambio.toFixed(1),
                estado: cambio > 0 ? 'positivo' : 'negativo',
                monto_hoy: hoy,
                monto_ayer: ayer
            };
        }

        function getVentasPorHora() {
            const hoy = new Date().toISOString().split('T')[0];
            const ventasHoy = state.ventas.filter(v => v.fecha === hoy);
            const porHora = {};
            for (let i = 0; i < 24; i++) {
                porHora[i] = 0;
            }
            ventasHoy.forEach(v => {
                const hora = parseInt(v.hora.substring(0, 2));
                porHora[hora] = (porHora[hora] || 0) + parseFloat(v.monto_venta || 0);
            });
            return porHora;
        }

        function getVentasPorMaquina() {
            const ventasHoy = getVentasHoy();
            const porMaquina = {};
            ventasHoy.forEach(v => {
                const maquina = state.maquinas.find(m => m.id === v.maquina_id);
                const nombre = maquina?.nombre || v.maquina_id || 'Desconocida';
                porMaquina[nombre] = (porMaquina[nombre] || 0) + parseFloat(v.monto_venta || 0);
            });
            return porMaquina;
        }

        function getTopProductosHoy() {
            const ventasHoy = getVentasHoy();
            const porProducto = {};
            ventasHoy.forEach(v => {
                const codigo = v.producto_codigo || 'Desconocido';
                const producto = state.inventario.find(p => p.sku === codigo);
                const nombre = producto?.nombre_producto || codigo;
                porProducto[nombre] = (porProducto[nombre] || 0) + 1;
            });
            return Object.entries(porProducto)
                .map(([nombre, count]) => ({ nombre, count }))
                .sort((a, b) => b.count - a.count)
                .slice(0, 5);
        }

        function getHoraMayorVenta() {
            const porHora = getVentasPorHora();
            let maxHora = 0;
            let maxMonto = 0;
            for (let hora in porHora) {
                if (porHora[hora] > maxMonto) {
                    maxMonto = porHora[hora];
                    maxHora = hora;
                }
            }
            return { hora: parseInt(maxHora), monto: maxMonto };
        }

        function getMaquinaMasProductiva() {
            const porMaquina = getVentasPorMaquina();
            let maxMaquina = '';
            let maxMonto = 0;
            for (let maquina in porMaquina) {
                if (porMaquina[maquina] > maxMonto) {
                    maxMonto = porMaquina[maquina];
                    maxMaquina = maquina;
                }
            }
            return { nombre: maxMaquina, monto: maxMonto };
        }

        function getStockCritico() {
            // Retorna productos con cantidad_actual <= cantidad_minima (5 por defecto)
            return state.inventario.filter(p => (p.cantidad_actual || 0) <= (p.cantidad_minima || 5));
        }

        // ============================================

        // ============================================
        function renderGastos() {
            const getCategoriaBadge = (categoria) => {

                    'Arriendo': 'bg-orange-100 text-orange-800',
                    'Compra productos': 'bg-green-100 text-green-800',
                    'Mantenimiento': 'bg-blue-100 text-blue-800',
                    'Otros': 'bg-gray-100 text-gray-800'
                };
                return colores[categoria] || 'bg-gray-100 text-gray-800';
            };

            const totalGastos = state.gastos.reduce((sum, g) => sum + (g.monto_total || 0), 0);
            const gastosPorCategoria = {};
            state.gastos.forEach(g => {
                if (!gastosPorCategoria[g.categoria]) gastosPorCategoria[g.categoria] = 0;
                gastosPorCategoria[g.categoria] += g.monto_total || 0;

            return `

                                    <option value="Mantenimiento">Mantenimiento</option>
                                    <option value="Otros">Otros</option>
                                </select>
                            </div>
                            <div class="col-span-2">
                                <label class="block text-sm font-bold mb-2">Descripción</label>
                                <textarea id="gasto_descripcion" class="w-full border p-2 rounded" rows="3" placeholder="Detalles del gasto..."></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-2">Monto Neto</label>
                                <input id="gasto_monto_neto" type="number" class="w-full border p-2 rounded" placeholder="0.00" step="0.01">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-2">IVA Automático (19%)</label>
                                <input type="text" class="w-full border p-2 rounded bg-gray-100" placeholder="Se calcula automáticamente" readonly>
                            </div>
                            <button type="button" onclick="window.saveGasto()" class="col-span-2 bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 font-bold">
                                💾 Guardar Gasto
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-lg shadow-md">
                            <h2 class="text-2xl font-bold mb-4">📊 Total de Gastos</h2>
                            <div class="text-5xl font-bold text-green-600 mb-4">$${totalGastos.toLocaleString('es-CL')}</div>
                            <div class="space-y-2">
                                ${Object.entries(gastosPorCategoria).map(([cat, monto]) => `
                                    <div class="flex justify-between p-2 bg-gray-50 rounded">
                                        <span class="text-sm font-bold">${cat}</span>
                                        <span class="text-sm font-bold">$${monto.toLocaleString('es-CL')}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-lg shadow-md">
                            <h2 class="text-2xl font-bold mb-4">📋 Últimos Gastos</h2>
                            ${state.gastos.slice(0, 5).length > 0 ? `
                                <div class="space-y-2">
                                    ${state.gastos.slice(0, 5).map(g => `
                                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded">
                                            <div>
                                                <span class="text-xs px-2 py-1 rounded font-bold ${getCategoriaBadge(g.categoria)}">${g.categoria}</span>
                                                <p class="text-sm mt-1">${g.descripcion || 'Sin descripción'}</p>
                                            </div>
                                            <div class="text-right">
                                                <p class="font-bold">$${g.monto_total.toLocaleString('es-CL')}</p>
                                                <p class="text-xs text-gray-600">${new Date(g.fecha).toLocaleDateString('es-CL')}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : `
                                <p class="text-gray-500 text-center py-4">Sin gastos registrados aún</p>
                            `}
                        </div>
                    </div>

                    ${state.gastos.length > 0 ? `
                        <div class="bg-white p-6 rounded-lg shadow-md">
                            <h2 class="text-2xl font-bold mb-4">📋 Histórico Completo de Gastos</h2>
                            
                            <table class="w-full border text-sm">
                                <thead class="bg-gray-100">

                                        <th class="p-3 text-left border">Fecha</th>

                        </div>
                    ` : ``}
                </div>
            `;
        }

        function render() {

                const errorMsg = state.error ? `<div class="text-red-300 text-sm mt-4">❌ ${state.error}</div>` : '';
                app.innerHTML = `
                    <div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-600 to-blue-800">
                        <div class="text-white text-center">
                            <div class="text-6xl mb-4 animate-bounce">📦</div>
                            <div class="text-2xl font-bold">GO BOX Dashboard</div>
                            <div class="text-sm mt-2 opacity-80">Cargando datos...</div>
                            ${errorMsg}
                        </div>
                    </div>
                `;
                return;
            }

            const contentMap = {
                dashboard: renderDashboard,
                inventario: renderInventario,
                asignaciones: renderAsignaciones,
                historial: renderHistorial,
                maquinas: renderMaquinas,
                analytics: renderAnalytics,
                inventario_inicial: renderInventarioInicial,
                gastos: renderGastos,
            };

            const content = (contentMap[state.activeTab] || renderDashboard)();

            app.innerHTML = `
                <div class="min-h-screen bg-gray-50">
                    <header class="bg-gradient-to-r from-blue-600 to-blue-800 text-white shadow-lg sticky top-0 z-40">
                        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center flex-wrap gap-4">
                            <div class="flex items-center gap-3">
                                <div class="text-4xl">📦</div>
                                <div>
                                    <div class="logo">
                                        <span class="logo-go">GO</span><span class="logo-box">BOX</span>
                                    </div>
                                    <div class="text-xs opacity-80">Tu Tienda 24/7</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="text-sm">👤 ${state.currentUser}</div>
                                <button onclick="window.handleLogout()" class="bg-red-600 text-white px-4 py-2 rounded font-bold hover:bg-red-700">
                                    🚪 Salir
                                </button>
                                <button onclick="window.location.reload()" class="bg-white text-blue-600 px-4 py-2 rounded font-bold hover:bg-gray-100">
                                    🔄 Actualizar
                                </button>
                            </div>
                        </div>
                    </header>

                    <div class="max-w-7xl mx-auto px-4 py-6">
                        <div class="flex gap-2 mb-6 overflow-x-auto border-b">
                            <button onclick="window.setTab('dashboard')" class="tab-btn ${state.activeTab === 'dashboard' ? 'active' : ''} flex items-center gap-2 px-4 py-3 border-b-2 font-bold whitespace-nowrap text-gray-700">
                                📊 Dashboard
                            </button>
                            <button onclick="window.setTab('analytics')" class="tab-btn ${state.activeTab === 'analytics' ? 'active' : ''} flex items-center gap-2 px-4 py-3 border-b-2 font-bold whitespace-nowrap text-gray-700">
                                📈 Analítica
                            </button>
                            <button onclick="window.setTab('inventario')" class="tab-btn ${state.activeTab === 'inventario' ? 'active' : ''} flex items-center gap-2 px-4 py-3 border-b-2 font-bold whitespace-nowrap text-gray-700">
                                📦 Inventario
                            </button>
                            <button onclick="window.setTab('asignaciones')" class="tab-btn ${state.activeTab === 'asignaciones' ? 'active' : ''} flex items-center gap-2 px-4 py-3 border-b-2 font-bold whitespace-nowrap text-gray-700">
                                🎯 Asignaciones
                            </button>
                            <button onclick="window.setTab('historial')" class="tab-btn ${state.activeTab === 'historial' ? 'active' : ''} flex items-center gap-2 px-4 py-3 border-b-2 font-bold whitespace-nowrap text-gray-700">
                                📋 Historial
                            </button>
                            <button onclick="window.setTab('maquinas')" class="tab-btn ${state.activeTab === 'maquinas' ? 'active' : ''} flex items-center gap-2 px-4 py-3 border-b-2 font-bold whitespace-nowrap text-gray-700">
                                ⚙️ Máquinas
                            </button>
                            <div class="border-l border-gray-300 mx-2"></div>
                            <button onclick="window.setTab('inventario_inicial')" class="tab-btn ${state.activeTab === 'inventario_inicial' ? 'active' : ''} flex items-center gap-2 px-4 py-3 border-b-2 font-bold whitespace-nowrap text-gray-700">
                                📦 Inv. Inicial
                            </button>
                            <button onclick="window.setTab('gastos')" class="tab-btn ${state.activeTab === 'gastos' ? 'active' : ''} flex items-center gap-2 px-4 py-3 border-b-2 font-bold whitespace-nowrap text-gray-700">
                                💰 Gastos
                            </button>
                        </div>

                        ${content}
                    </div>

                    <footer class="bg-gray-900 text-white text-center py-6 mt-12">
                        <div>GO BOX Dashboard v6.0 (FASE 3 Integrado) | Concepción, Chile 🇨🇱</div>
                    </footer>
                </div>

                ${state.showScannerModal ? renderScannerModal() : ''}
                ${state.showEditProductModal ? renderEditProductModal() : ''}
                ${state.showEditAssignmentModal ? renderEditAssignmentModal() : ''}
                ${state.showLoginModal ? renderLoginModal() : ''}
            `;
            
            // Inicializar gráficos cuando estamos en dashboard
            if (state.activeTab === 'dashboard') {
                setTimeout(() => window.initCharts(), 100);
            }
        }

        // ============================================
        // GRÁFICOS INTERACTIVOS - CHART.JS
        // ============================================
        window.initCharts = function() {
            // Datos para gráficos
            const ventasPorHora = getVentasPorHora();
            const porMaquina = getVentasPorMaquina();

            // Gráfico 1: Ventas por Hora
            const ctx1 = document.getElementById('chartVentasHora');
            if (ctx1 && Object.keys(ventasPorHora).length > 0) {
                // Destruir gráfico anterior si existe
                if (window.chartVentasHoraInstance) {
                    window.chartVentasHoraInstance.destroy();
                }

                const horasLabels = Array.from({length: 24}, (_, i) => `${i}:00`);
                const horasData = horasLabels.map((_, i) => ventasPorHora[i] || 0);

                window.chartVentasHoraInstance = new Chart(ctx1, {
                    type: 'line',
                    data: {
                        labels: horasLabels,
                        datasets: [{
                            label: 'Ventas ($)',
                            data: horasData,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 4,
                            pointBackgroundColor: '#3b82f6',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                            pointHoverRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: true, position: 'top' },
                            tooltip: { backgroundColor: 'rgba(0,0,0,0.8)', padding: 12, titleFont: { size: 14 }, bodyFont: { size: 12 } }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: function(value) {
                                        return '$' + value.toLocaleString('es-CL');
                                    }
                                }
                            }
                        }
                    }
                });
            }

            // Gráfico 2: Ventas por Máquina
            const ctx2 = document.getElementById('chartVentasMaquina');
            if (ctx2 && Object.keys(porMaquina).length > 0) {
                // Destruir gráfico anterior si existe
                if (window.chartVentasMaquinaInstance) {
                    window.chartVentasMaquinaInstance.destroy();
                }

                const maquinasLabels = Object.keys(porMaquina);
                const maquinasData = Object.values(porMaquina);
                const colores = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'];

                window.chartVentasMaquinaInstance = new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: maquinasLabels,
                        datasets: [{
                            label: 'Ventas ($)',
                            data: maquinasData,
                            backgroundColor: colores.slice(0, maquinasLabels.length),
                            borderRadius: 6,
                            borderSkipped: false
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: true, position: 'top' }
                        },
                        scales: {
                            x: {
                                beginAtZero: true,
                                ticks: {
                                    callback: function(value) {
                                        return '$' + value.toLocaleString('es-CL');
                                    }
                                }
                            }
                        }
                    }
                });
            }
        };

        window.addEventListener('load', fetchAllData);
    </script>
</body>
</html>
