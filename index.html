        function createOfflineClient() {
            const fail = { data: null, error: { message: 'Supabase no disponible (sin conexión)' } };
            const chain = new Proxy(function () {}, {
                get: (target, prop) => prop === 'then' ? (resolve) => resolve(fail) : chain,
                apply: () => chain
            });
            return {
                from: () => chain,
                auth: {
                    getSession: async () => ({ data: { session: null }, error: null }),
                    onAuthStateChange: () => ({ data: { subscription: { unsubscribe() {} } } }),

        // ============================================
        // UTILIDADES
        // ============================================
        // Fecha local (Chile) en formato YYYY-MM-DD. toISOString() usa UTC y
        // después de las 21:00 hrs devolvía la fecha de "mañana".
        function fechaLocal(offsetDias = 0) {
            const d = new Date();
            d.setDate(d.getDate() + offsetDias);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        // Escapa texto antes de insertarlo en HTML (evita que comillas o < > rompan la vista)
        function esc(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Formatea montos CLP sin reventar si el valor viene null/string
        function clp(value, opts = {}) {
            return (Number(value) || 0).toLocaleString('es-CL', { maximumFractionDigits: 0, ...opts });
        }

        function emptyProduct() {

        }

        // ============================================
        // NUMERACIÓN DE ESPACIOS (verificada con el reporte real de PayScan)
        // Máquina TCN: bandejas de 10 posiciones. espacio = (bandeja − 1) × 10 + posición
        // Bandeja 1 = 1..10, Bandeja 2 = 11..20, ..., Bandeja 6 = 51..60
        // PayScan lo informa en la columna "Producto" en hexadecimal: '3800' o '0038' = 0x38 = 56
        // ============================================
        const MAX_FILAS = 9;          // bandejas
        const MAX_COLUMNAS = 10;      // posiciones por bandeja (numeración TCN de 10 en 10)
        const POSICIONES_TCN = 10;

        function codigoEspacio(bandeja, posicion) {
            return String((bandeja - 1) * POSICIONES_TCN + posicion);
        }

        // Normaliza el espacio: 12, '12', '012' → '12'. Formato antiguo del dashboard '0102' (fila 1, col 2) → '2'
        function normEspacio(value) {
            if (value === null || value === undefined) return '';
            const txt = String(value).trim();
            if (/^\d{4}$/.test(txt)) {
                return codigoEspacio(parseInt(txt.substring(0, 2), 10), parseInt(txt.substring(2, 4), 10));
            }
            const n = parseInt(txt, 10);
            return isNaN(n) ? txt : String(n);
        }

        // Código "Producto" de PayScan → número de espacio
        function decodeEspacioPayscan(code) {
            const txt = String(code ?? '').trim().toUpperCase();
            if (/^[0-9A-F]{4}$/.test(txt)) {
                const alto = parseInt(txt.substring(0, 2), 16);
                const bajo = parseInt(txt.substring(2, 4), 16);
                const n = alto || bajo;
                return n ? String(n) : '';
            }
            if (/^\d{1,2}$/.test(txt)) return String(parseInt(txt, 10));
            return '';
        }

        function describeEspacio(codigo) {
            const n = parseInt(codigo, 10);
            if (isNaN(n) || n < 1) return `Espacio ${esc(codigo)}`;
            return `Espacio ${n} (Bandeja ${Math.floor((n - 1) / POSICIONES_TCN) + 1} · Posición ${((n - 1) % POSICIONES_TCN) + 1})`;
        }

        function buildCapacidades(filas, columnas, porSlot) {
            const caps = {};
            for (let f = 1; f <= (filas || 0); f++) {
                for (let c = 1; c <= (columnas || 0); c++) {
                    caps[codigoEspacio(f, c)] = porSlot || 1;
                }
            }
            return caps;
        }

        // Capacidad por espacio: se guarda en maquinas.capacidad_por_espacio como JSON {"1": 8, "3": 8, "11": 12, ...}
        function getCapacidades(maquina) {
            let c = maquina ? maquina.capacidad_por_espacio : null;
            if (typeof c === 'string') { try { c = JSON.parse(c || '{}'); } catch (e) { c = {}; } }
            return (c && typeof c === 'object' && !Array.isArray(c)) ? c : {};
        }
        function capacidadEspacio(maquina, espacio) {
            const n = parseInt(getCapacidades(maquina)[normEspacio(espacio)], 10);
            return n > 0 ? n : null;
        }

        // Serial sin ceros a la izquierda: '0000000000440864' → '440864', '0' → '0'
        function normSerial(v) {
            const t = String(v ?? '').trim();
            return t.replace(/^0+(?=.)/, '');
        }

        // Una venta puede traer maquina_id o solo el serial del PayScan
        function getMaquinaDeVenta(v) {
            if (v.maquina_id) {
                const m = state.maquinas.find(m => String(m.id) === String(v.maquina_id));
                if (m) return m;
            }
            if (v.serial_amit !== undefined && v.serial_amit !== null && v.serial_amit !== '') {
                return state.maquinas.find(m => normSerial(m.serial_amit) === normSerial(v.serial_amit)) || null;
            }
            return null;
        }

        function getAsignacion(maquinaId, espacio) {

            return state.asignaciones.find(a => String(a.maquina_id) === String(maquinaId) && normEspacio(a.espacio) === cod) || null;
        }

        // Producto vendido: por código del producto o, si PayScan no lo trae, por lo asignado en ese espacio
        function getProductoDeVenta(v) {

            if (maquina && v.espacio !== undefined && v.espacio !== null) {

            return null;

        async function fetchAllData() {
            if (state.demoMode) { loadMockData(); render(); return; }
            if (!state.session) { render(); return; } // sin sesión no se consulta nada
            state.loading = true;
            state.loadError = null;
            state.loadErrorDetalle = '';
            render();
            try {
                // Renovar la sesión UNA vez antes de las consultas en paralelo.
                // (Con la sesión guardada de otro día, varias consultas intentaban renovarla a la vez.)
                const { data: ses, error: errSes } = await supabaseClient.auth.getSession();
                if (errSes || !ses || !ses.session) {
                    setSession(null); limpiarDatos();
                    state.loading = false;
                    state.loginError = 'Tu sesión expiró. Ingresa nuevamente.';
                    render();
                    return;
                }
                state.session = ses.session;
                const results = await Promise.allSettled([
                    fetchVentas(),
                    fetchInventario(),
                    fetchAsignaciones(),
                    fetchMaquinas(),
                    fetchHistorial()
                ]);
                // En producción NO se muestran datos inventados: si algo falla se avisa.
                const fallidas = ['Ventas', 'Inventario', 'Asignaciones', 'Máquinas']
                    .filter((_, i) => !(results[i].status === 'fulfilled' && results[i].value === true));
                if (fallidas.length) {
                    state.loadError = `No se pudieron cargar: ${fallidas.join(', ')}.`;
                    state.loadErrorDetalle = Object.values(state.erroresCarga || {}).filter(Boolean).join(' · ');
                }
            } catch (err) {
                console.error('Error cargando datos:', err);
                state.loadError = 'Error inesperado al cargar datos.';
            } finally {
                state.loading = false;
                render(); // render() ya inicializa los gráficos del dashboard
            }
        }

        // Cada fetch devuelve true si la consulta a Supabase fue exitosa
        function registrarErrorCarga(que, err) {
            state.erroresCarga = state.erroresCarga || {};
            state.erroresCarga[que] = `${que}: ${[err && err.code, err && err.message].filter(Boolean).join(' ') || 'error desconocido'}`;
        }

        // Reintenta una vez (redes móviles inestables o sesión renovándose)
        async function conReintento(fn) {
            try { return await fn(); }
            catch (e) {
                await new Promise(r => setTimeout(r, 1500));
                if (/jwt|token|401|PGRST30/i.test(String(e && (e.message || e.code)))) { try { await supabaseClient.auth.refreshSession(); } catch (_) {} }
                return await fn();
            }
        }

        async function fetchVentas() {
            if (state.erroresCarga) delete state.erroresCarga['Ventas'];
            try {
                // Todo el historial de ventas APROBADAS (para análisis por mes). Supabase entrega máx. 1000 filas
                // por consulta, así que se pide por páginas.
                let todas = [];
                for (let from = 0; from < 200000; from += 1000) {
                    const { data, error } = await conReintento(async () => {
                        const r = await supabaseClient
                        .from('ventas_payscan')
                        .select('id_transaccion, fecha, hora, timestamp_completo, serial_amit, maquina_id, espacio, monto_venta, comision, neto_comision, resultado_transaccion, metodo_pago')
                        .eq('resultado_transaccion', 'APPROVED')
                        .order('timestamp_completo', { ascending: false })
                        .range(from, from + 999);
                        if (r.error) throw r.error;
                        return r;
                    });
                    if (error) throw error;
                    todas = todas.concat(data || []);
                    if (!data || data.length < 1000) break;
                }
                state.ventas = todas;
                return true;
            } catch (err) {
                console.warn('⚠️ No se pudo conectar con ventas:', err);
                registrarErrorCarga('Ventas', err);
                state.ventas = [];
                return false;
            }
        }

        async function fetchInventario() {
            const { data, error } = await conReintento(async () => { const r = await supabaseClient.from('inventario_bodega').select('*').order('fecha_caducidad', { ascending: true }); if (r.error) throw r.error; return r; }).catch(e => ({ error: e }));
            if (error) { console.error('Error fetching inventario:', error); registrarErrorCarga('Inventario', error); return false; }
            state.inventario = data || [];
            return true;
        }

        async function fetchAsignaciones() {
            const { data, error } = await conReintento(async () => { const r = await supabaseClient.from('asignaciones_maquina').select('*'); if (r.error) throw r.error; return r; }).catch(e => ({ error: e }));
            if (error) { console.error('Error fetching asignaciones:', error); registrarErrorCarga('Asignaciones', error); return false; }
            state.asignaciones = data || [];
            return true;
        }

        async function fetchMaquinas() {
            const { data, error } = await conReintento(async () => { const r = await supabaseClient.from('maquinas').select('*'); if (r.error) throw r.error; return r; }).catch(e => ({ error: e }));
            if (error) { console.error('Error fetching maquinas:', error); registrarErrorCarga('Máquinas', error); return false; }
            state.maquinas = data || [];

        // Historial ahora vive en Supabase (tabla historial_cambios): compartido entre tus dispositivos
        // y socios, y no se puede editar ni borrar desde el dashboard (auditoría real).
        async function fetchHistorial() {
            const { data, error } = await supabaseClient
                .from('historial_cambios')
                .select('created_at, usuario, accion, detalles')
                .order('created_at', { ascending: false })
                .limit(100);
            if (error) { console.warn('Historial no disponible:', error.message); state.historial = []; return false; }
            state.historial = (data || []).map(h => ({ timestamp: h.created_at, usuario: h.usuario, accion: h.accion, detalles: h.detalles }));
            return true;

        function guardarHistorial(accion, detalles) {
            const registro = {
                timestamp: new Date().toISOString(),
                usuario: state.currentUser,
                accion: accion,
                detalles: detalles
            };
            state.historial.unshift(registro);
            state.historial = state.historial.slice(0, 100);
            if (state.demoMode || !state.session) return;
            // Se registra en segundo plano; user_id lo asigna la base de datos (auth.uid())
            supabaseClient.from('historial_cambios')
                .insert([{ usuario: state.currentUser, accion, detalles: String(detalles).slice(0, 500) }])
                .then(({ error }) => { if (error) console.warn('No se pudo registrar en historial:', error.message); });
        }

        // Borra tokens de sesión guardados en este navegador (útil si quedaron corruptos)
        window.limpiarSesionGuardada = function() {
            try {
                Object.keys(localStorage).filter(k => k.startsWith('sb-') || k.includes('supabase')).forEach(k => localStorage.removeItem(k));
            } catch (e) {}
            state.loginError = 'Sesión guardada eliminada. Intenta ingresar de nuevo.';
            state.loginDetalle = '';
            state.loginLoading = false;
            render();

        window.updateLoginField = function(field, value) {

        window.handleLogin = async function() {
            if (state.loginLoading) return;
            const email = state.loginForm.email.trim().toLowerCase();
            const password = state.loginForm.password;

            const restante = Math.ceil((state.loginBlockedUntil - Date.now()) / 1000);
            if (restante > 0) {
                state.loginError = `Demasiados intentos. Espera ${restante} s.`;
                render();
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || !password) {
                state.loginError = 'Ingresa un correo válido y tu contraseña.';
                render();
                return;
            }

            state.loginLoading = true;
            state.loginError = '';
            render();

            let data = null, error = null;
            try {
                const limite = new Promise((_, rej) => setTimeout(() => rej(new Error('Supabase no respondió en 25 segundos')), 25000));
                ({ data, error } = await Promise.race([supabaseClient.auth.signInWithPassword({ email, password }), limite]));
            } catch (e) {
                error = e;
            } finally {
                state.loginLoading = false;
            }
            if (error) console.error('Login error:', error);
            state.loginDetalle = error ? [error.status, error.code, error.name, error.message].filter(Boolean).join(' · ') : '';

            if (error || !data || !data.session) {
                state.loginFails++;
                if (state.loginFails >= LOGIN_MAX_INTENTOS) {
                    state.loginBlockedUntil = Date.now() + LOGIN_BLOQUEO_SEG * 1000;
                    state.loginFails = 0;
                    setTimeout(() => { state.loginError = ''; render(); }, LOGIN_BLOQUEO_SEG * 1000 + 200);
                }
                // Mensaje genérico: no revela si el correo existe
                const msg = String(error && error.message || '');
                state.loginError = /invalid login credentials/i.test(msg) ? 'Correo o contraseña incorrectos.'
                    : /email not confirmed/i.test(msg) ? 'El usuario no está confirmado. En Supabase → Authentication → Users, confírmalo (o créalo con "Auto Confirm User").'
                    : /fetch|network|abort|respondi|disponible|timeout/i.test(msg) ? 'No hay respuesta del servidor. Revisa tu conexión o que el proyecto de Supabase esté activo.'
                    : 'No se pudo iniciar sesión.';
                state.loginForm.password = '';
                render();
                return;
            }

            state.loginFails = 0;
            state.loginForm = { email: '', password: '' };
            setSession(data.session);
            marcarActividad();
            guardarHistorial('LOGIN', `Inicio de sesión`);
            await fetchAllData();
        };

        window.handleLogout = async function(motivo) {
            if (!motivo && !confirm('¿Cerrar sesión?')) return;
            if (state.demoMode) { window.location.href = window.location.pathname; return; }
            // Registrar ANTES de cerrar (después ya no hay permiso para escribir)
            if (state.session) {
                await supabaseClient.from('historial_cambios')
                    .insert([{ usuario: state.currentUser, accion: 'LOGOUT', detalles: motivo || 'Sesión cerrada' }])
                    .then(() => {}, () => {});
            }
            await supabaseClient.auth.signOut();
            setSession(null);
            limpiarDatos();
            state.loginError = motivo ? 'Sesión cerrada por inactividad.' : '';
            render();
        };

        // --- Cierre automático por inactividad ---
        let ultimaActividad = Date.now();
        function marcarActividad() { ultimaActividad = Date.now(); }
        ['click', 'keydown', 'touchstart', 'scroll'].forEach(ev => window.addEventListener(ev, marcarActividad, { passive: true }));
        setInterval(() => {
            if (state.session && !state.demoMode && Date.now() - ultimaActividad > INACTIVIDAD_MAX_MIN * 60000) {
                window.handleLogout('Inactividad');
            }
        }, 60000);

        // Si Supabase invalida la sesión (expiró, se cerró en otra pestaña, usuario eliminado)
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT' && state.session) {
                setSession(null);
                limpiarDatos();
                render();
            } else if (event === 'TOKEN_REFRESHED' && session) {
                state.session = session;
            }
        });

        function puedeEscribir() {
            if (state.demoMode) { alert('Modo demo: los cambios no se guardan.'); return false; }
            if (!state.session) { alert('Tu sesión expiró. Vuelve a ingresar.'); return false; }

        }

        window.saveAssignment = async function() {
            if (!puedeEscribir()) return;
            if (!state.newAssignment.sku) {
                alert('⚠️ Debes seleccionar un producto');
                return;
            }

            const product = state.inventario.find(p => p.sku === state.newAssignment.sku);
            if (!product) {
                alert('⚠️ Producto no encontrado');
                return;
            }

            const capNueva = parseInt(state.newAssignment.capacidad, 10) || null;
            if (capNueva && state.newAssignment.cantidad_asignada > capNueva) {
                alert(`⚠️ La cantidad (${state.newAssignment.cantidad_asignada}) supera la capacidad del espacio (${capNueva}).`);
                return;
            }
            try {
                // Capacidad del espacio → se guarda en la máquina
                const maq = state.maquinas.find(m => String(m.id) === String(state.newAssignment.maquina_id));
                if (maq && capNueva !== capacidadEspacio(maq, state.newAssignment.espacio)) {
                    const caps = getCapacidades(maq);
                    if (capNueva) caps[normEspacio(state.newAssignment.espacio)] = capNueva; else delete caps[normEspacio(state.newAssignment.espacio)];
                    const { error: errCap } = await supabaseClient.from('maquinas').update({ capacidad_por_espacio: JSON.stringify(caps) }).eq('id', maq.id);
                    if (errCap) { alert('❌ Error al guardar la capacidad: ' + errCap.message); return; }
                    maq.capacidad_por_espacio = JSON.stringify(caps);
                }
                const existingAssignment = getAsignacion(state.newAssignment.maquina_id, state.newAssignment.espacio);

                if (existingAssignment) {
                    // Actualizar
                    const { error } = await supabaseClient.from('asignaciones_maquina').update({
                        espacio: normEspacio(state.newAssignment.espacio),
                        sku: state.newAssignment.sku,
                        cantidad_asignada: state.newAssignment.cantidad_asignada,
                        fecha_asignacion: fechaLocal(),
                        precio_venta_espacio: existingAssignment.sku === state.newAssignment.sku && Number(existingAssignment.precio_venta_espacio) > 0 ? existingAssignment.precio_venta_espacio : product.precio_venta_unitario,
                        productos_por_slot: state.newAssignment.productos_por_slot
                    }).eq('id', existingAssignment.id);

                    if (error) {
                        console.error('Error:', error);
                        alert('❌ Error al actualizar: ' + error.message);
                    } else {
                        guardarHistorial('ACTUALIZAR_ASIGNACION', `Máquina: ${state.newAssignment.maquina_id}, Espacio: ${state.newAssignment.espacio}, Producto: ${state.newAssignment.sku}, Cantidad: ${state.newAssignment.cantidad_asignada}`);
                        alert('✅ Asignación actualizada');
                        await fetchAsignaciones();
                        state.showEditAssignmentModal = false;
                        render();
                    }
                } else {
                    // Crear nueva
                    const { error } = await supabaseClient.from('asignaciones_maquina').insert([{
                        maquina_id: state.newAssignment.maquina_id,
                        espacio: normEspacio(state.newAssignment.espacio),
                        sku: state.newAssignment.sku,
                        cantidad_asignada: state.newAssignment.cantidad_asignada,
                        fecha_asignacion: fechaLocal(),
                        precio_venta_espacio: product.precio_venta_unitario,
                        productos_por_slot: state.newAssignment.productos_por_slot
                    }]);

                    if (error) {
                        console.error('Error:', error);
                        alert('❌ Error al crear: ' + error.message);
                    } else {
                        guardarHistorial('CREAR_ASIGNACION', `Máquina: ${state.newAssignment.maquina_id}, Espacio: ${state.newAssignment.espacio}, Producto: ${state.newAssignment.sku}, Cantidad: ${state.newAssignment.cantidad_asignada}`);
                        alert('✅ Asignación creada');
                        await fetchAsignaciones();
                        state.showEditAssignmentModal = false;
                        render();
                    }
                }
            } catch (err) {
                console.error('Error:', err);
                alert('💥 Error inesperado: ' + err.message);
            }
        };

        function getFilteredInventario() {
            return state.inventario.filter(p => {
                const matchSearch = !state.searchQuery || String(p.sku || '').toLowerCase().includes(state.searchQuery) || String(p.nombre_producto || '').toLowerCase().includes(state.searchQuery);
                const matchFamilia = state.filterFamilia === 'Todos' || p.familia === state.filterFamilia;
                const matchProveedor = state.filterProveedor === 'Todos' || p.proveedor === state.filterProveedor;
                
                let matchEstado = true;
                if (state.filterEstado === 'Bajo Stock') matchEstado = (Number(p.cantidad_actual) || 0) < STOCK_CRITICO;
                else if (state.filterEstado === 'Por Vencer') {
                    if (!p.fecha_caducidad) return false;
                    const venc = new Date(p.fecha_caducidad);
                    const hoy = new Date();
                    const dias = (venc - hoy) / (1000 * 60 * 60 * 24);
                    matchEstado = dias < 30 && dias > 0;
                }

                return matchSearch && matchFamilia && matchProveedor && matchEstado;
            });
        }

        // ============================================
        // REPORTES
        // ============================================
        window.exportarInventarioCSV = function() {
            const filtered = getFilteredInventario();
            // Separador ";" y BOM UTF-8 → Excel en español abre columnas y tildes correctamente
            const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
            let csv = 'SKU;Nombre;Familia;Cantidad;Precio Compra;Precio Venta;Vencimiento;Proveedor\n';

            filtered.forEach(p => {
                csv += [q(p.sku), q(p.nombre_producto), q(p.familia), Number(p.cantidad_actual) || 0, Number(p.precio_compra_unitario) || 0, Number(p.precio_venta_unitario) || 0, q(p.fecha_caducidad), q(p.proveedor)].join(';') + '\n';
            });

            const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `inventario_${fechaLocal()}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            guardarHistorial('EXPORTAR_CSV', `${filtered.length} productos`);
        };

        function onBarcodeDetected(result) {
            if (result && result.codeResult && result.codeResult.code) {
                const barcode = result.codeResult.code;
                stopScanner();
                state.detectedBarcode = barcode;
                const existingProduct = state.inventario.find(p => String(p.sku) === String(barcode));
                state.scannedProductData = existingProduct || { sku: barcode, nombre_producto: '', familia: 'Snacks', proveedor: '' };
                render();
            }
        }

        function initializeScanner() {
            if (state.scannerActive) return;
            const scanner = document.getElementById('scanner');
            if (!scanner) return; // antes se marcaba activo antes de validar y quedaba bloqueado
            if (typeof Quagga === 'undefined') { alert('No se pudo cargar el lector de códigos'); return; }
            state.scannerActive = true;

            Quagga.init({
                inputStream: {
                    name: 'Live',
                    type: 'LiveStream',
                    target: scanner,
                    constraints: { width: { min: 300 }, height: { min: 300 }, facingMode: 'environment' }
                },
                decoder: {
                    workers: 2,
                    multiple: false,
                    readers: ['ean_reader', 'upc_reader', 'code128_reader', 'code39_reader']
                }
            }, function(err) {
                if (err) {
                    console.error('Quagga init error:', err);
                    alert('Error al acceder a la cámara (requiere HTTPS y permiso de cámara)');
                    state.scannerActive = false;
                    return;
                }
                // Evitar acumular listeners en cada "Escanear Otro"
                Quagga.offDetected(onBarcodeDetected);
                Quagga.onDetected(onBarcodeDetected);
                Quagga.start();
            });
        }

        function stopScanner() {
            if (state.scannerActive) {
                try {
                    Quagga.offDetected(onBarcodeDetected);
                    Quagga.stop();
                } catch (e) {
                    console.log('Scanner already stopped');
                }
                state.scannerActive = false;
            }
        }

        // ============================================
        // FUNCIONES DE CÁLCULO PARA DASHBOARD (FASE 1)
        // ============================================
        const STOCK_CRITICO = 5; // unidades bajo las cuales se considera stock crítico

        // FALTABA: renderDashboard() la llamaba y lanzaba ReferenceError → el Dashboard no cargaba
        function getStockCritico() {
            return state.inventario
                .filter(p => (Number(p.cantidad_actual) || 0) < STOCK_CRITICO)
                .sort((a, b) => (Number(a.cantidad_actual) || 0) - (Number(b.cantidad_actual) || 0))
                .slice(0, 10);
        }

        // Solo ventas aprobadas (si la columna existe)
        function esVentaValida(v) {
            return !v.resultado_transaccion || String(v.resultado_transaccion).toUpperCase() === 'APPROVED';
        }

        function fechaDeVenta(v) {
            if (v.fecha) return String(v.fecha).substring(0, 10);
            if (v.timestamp_completo) return String(v.timestamp_completo).substring(0, 10);
            return '';
        }

        // ============================================
        // PERÍODO DE ANÁLISIS
        // Como las ventas se importan manualmente desde PayScan, "hoy" casi siempre estaría vacío.
        // Por defecto se muestra el último día con ventas importadas.
        // ============================================
        const PERIODOS = {
            ultimo: 'Último día con datos',
            hoy: 'Hoy',
            '7d': 'Últimos 7 días',
            '30d': 'Últimos 30 días'
        };

        function addDias(fechaStr, n) {
            const [y, m, d] = fechaStr.split('-').map(Number);
            const dt = new Date(Date.UTC(y, m - 1, d + n));
            return dt.toISOString().substring(0, 10);
        }

        function fmtFecha(fechaStr) {
            if (!fechaStr) return '—';
            const [y, m, d] = String(fechaStr).substring(0, 10).split('-');
            return `${d}-${m}-${y}`;
        }

        function getUltimaFechaConVentas() {
            let max = '';
            state.ventas.forEach(v => { if (esVentaValida(v)) { const f = fechaDeVenta(v); if (f > max) max = f; } });
            return max;
        }

        function getUltimaVenta() {
            let max = null;
            state.ventas.forEach(v => {
                const ts = v.timestamp_completo ? String(v.timestamp_completo) : `${fechaDeVenta(v)}T${v.hora || '00:00:00'}`;
                if (!max || ts > max) max = ts;
            });
            return max;
        }

        const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
        const MESES_CORTOS = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
        function labelMes(ym, corto = false) {
            const [y, m] = ym.split('-').map(Number);
            return `${(corto ? MESES_CORTOS : MESES)[m - 1]} ${y}`;
        }
        function ultimoDiaMes(ym) {
            const [y, m] = ym.split('-').map(Number);
            return new Date(Date.UTC(y, m, 0)).toISOString().substring(0, 10);
        }
        function mesAnterior(ym) {
            const [y, m] = ym.split('-').map(Number);
            return new Date(Date.UTC(y, m - 2, 1)).toISOString().substring(0, 7);
        }
        // Meses con ventas + mes actual, del más reciente al más antiguo
        function getMesesDisponibles() {
            const set = new Set([fechaLocal().substring(0, 7)]);
            state.ventas.forEach(v => { const f = fechaDeVenta(v); if (f) set.add(f.substring(0, 7)); });
            return [...set].sort().reverse();
        }

        // Color fijo por máquina (sigue a la máquina, no a su posición en el ranking)
        const COLORES_MAQUINA = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];
        function colorMaquina(id) {
            const ids = state.maquinas.map(m => String(m.id)).sort();
            const i = ids.indexOf(String(id));
            return i >= 0 ? COLORES_MAQUINA[i % COLORES_MAQUINA.length] : '#8a8a86';
        }
        function nombreFiltroMaquina() {
            if (!state.maquinaFiltro || state.maquinaFiltro === 'todas') return 'Todas las máquinas';
            const m = state.maquinas.find(x => String(x.id) === String(state.maquinaFiltro));
            return m ? m.nombre : 'Máquina';
        }

        function getRangoPeriodo() {
            const periodo = state.periodo || 'ultimo';
            if (periodo.startsWith('mes:')) {
                const ym = periodo.substring(4);
                const desde = `${ym}-01`;
                const finMes = ultimoDiaMes(ym);
                const ultima = getUltimaFechaConVentas();
                // Mes en curso (datos hasta antes de fin de mes): se compara con el mismo tramo del mes anterior
                const parcial = ultima && ultima >= desde && ultima < finMes;
                const prev = mesAnterior(ym);
                const dia = parcial ? Number(ultima.substring(8, 10)) : 31;
                const prevFin = ultimoDiaMes(prev);
                const prevHasta = parcial ? (`${prev}-${String(dia).padStart(2, '0')}` < prevFin ? `${prev}-${String(dia).padStart(2, '0')}` : prevFin) : prevFin;
                return {
                    periodo, dias: 31, desde, hasta: finMes, prevDesde: `${prev}-01`, prevHasta,
                    label: labelMes(ym) + (parcial ? ` (datos hasta el ${fmtFecha(ultima)})` : ''),
                    prevLabel: parcial ? `${labelMes(prev)} (1 al ${dia})` : labelMes(prev)
                };
            }
            const ancla = periodo === 'hoy' ? fechaLocal() : (getUltimaFechaConVentas() || fechaLocal());
            const dias = periodo === '7d' ? 7 : periodo === '30d' ? 30 : 1;
            const hasta = ancla;
            const desde = addDias(ancla, -(dias - 1));
            const prevHasta = addDias(desde, -1);
            const prevDesde = addDias(prevHasta, -(dias - 1));
            const label = dias === 1 ? fmtFecha(desde) : `${fmtFecha(desde)} al ${fmtFecha(hasta)}`;
            const prevLabel = dias === 1 ? fmtFecha(prevDesde) : `${fmtFecha(prevDesde)} al ${fmtFecha(prevHasta)}`;
            return { periodo, dias, desde, hasta, prevDesde, prevHasta, label, prevLabel };
        }

        // maquinaId: 'todas' o el id de una máquina (por defecto, el filtro elegido en pantalla)
        function ventasEntre(desde, hasta, maquinaId = state.maquinaFiltro) {
            const filtrar = maquinaId && maquinaId !== 'todas';
            return state.ventas.filter(v => {
                const f = fechaDeVenta(v);
                if (!(f >= desde && f <= hasta && esVentaValida(v))) return false;
                if (!filtrar) return true;
                const m = getMaquinaDeVenta(v);
                return m && String(m.id) === String(maquinaId);
            });
        }

        function getVentasPeriodo() {
            const r = getRangoPeriodo();
            return ventasEntre(r.desde, r.hasta);
        }

        function getVentasPeriodoAnterior() {
            const r = getRangoPeriodo();
            return ventasEntre(r.prevDesde, r.prevHasta);
        }

        const sumaMontos = arr => arr.reduce((sum, v) => sum + parseFloat(v.monto_venta || 0), 0);

        // Una transacción puede incluir varias unidades (ej: $3.900 = 3 × $1.300)
        function unidadesDeVenta(v) {
            const maquina = getMaquinaDeVenta(v);
            const asig = maquina ? getAsignacion(maquina.id, v.espacio) : null;
            let precio = asig ? Number(asig.precio_venta_espacio) : 0;
            if (!precio && asig) {
                const prod = state.inventario.find(p => String(p.sku) === String(asig.sku));
                precio = prod ? Number(prod.precio_venta_unitario) : 0;
            }
            const monto = Number(v.monto_venta) || 0;
            if (precio > 0 && monto >= precio * 2 && monto % precio === 0) return monto / precio;
            return 1;
        }

        function getComparativa() {
            const actual = sumaMontos(getVentasPeriodo());
            const anterior = sumaMontos(getVentasPeriodoAnterior());
            if (anterior === 0) return { porcentaje: 0, estado: 'sin_comparar', monto_hoy: actual, monto_ayer: anterior };
            const cambio = ((actual - anterior) / anterior) * 100;
            return {
                porcentaje: cambio.toFixed(1),
                estado: cambio > 0 ? 'positivo' : cambio < 0 ? 'negativo' : 'igual',
                monto_hoy: actual,
                monto_ayer: anterior
            };
        }

        // Alias usados por el resto del código
        const getVentasHoy = getVentasPeriodo;
        const getTotalVentasHoy = () => sumaMontos(getVentasPeriodo());
        const getTransaccionesHoy = () => getVentasPeriodo().length;
        function getTicketPromedio() {
            const v = getVentasPeriodo();
            return v.length ? sumaMontos(v) / v.length : 0;
        }
        const getComparativaHoyVsAyer = getComparativa;

        function getVentasPorHora() {
            const ventas = getVentasPeriodo();
            const porHora = {};
            for (let i = 0; i < 24; i++) porHora[i] = 0;
            ventas.forEach(v => {
                const horaTxt = v.hora || (v.timestamp_completo ? String(v.timestamp_completo).substring(11, 13) : '');
                const hora = parseInt(String(horaTxt).substring(0, 2), 10);
                if (isNaN(hora) || hora < 0 || hora > 23) return;
                porHora[hora] += parseFloat(v.monto_venta || 0);
            });
            return porHora;
        }

        function getVentasPorMaquina() {
            const porMaquina = {};
            getVentasPeriodo().forEach(v => {
                const maquina = getMaquinaDeVenta(v);
                const nombre = maquina?.nombre || (v.serial_amit ? `Serial ${normSerial(v.serial_amit)}` : 'Desconocida');
                porMaquina[nombre] = (porMaquina[nombre] || 0) + parseFloat(v.monto_venta || 0);
            });
            return porMaquina;
        }

        function getVentasHoyPorEspacio(maquinaId) {
            const res = {};
            const r = getRangoPeriodo();
            ventasEntre(r.desde, r.hasta, maquinaId).forEach(v => {
                const m = getMaquinaDeVenta(v);
                if (!m || String(m.id) !== String(maquinaId)) return;
                const e = normEspacio(v.espacio);
                if (!e) return;
                res[e] = res[e] || { count: 0, unidades: 0, monto: 0 };
                res[e].count++;
                res[e].unidades += unidadesDeVenta(v);
                res[e].monto += parseFloat(v.monto_venta || 0);
            });
            return res;
        }

        function getTopProductosHoy() {
            const porProducto = {};
            getVentasPeriodo().forEach(v => {
                const producto = getProductoDeVenta(v);
                const maquina = getMaquinaDeVenta(v);
                const nombre = producto
                    ? producto.nombre_producto
                    : `Espacio ${normEspacio(v.espacio) || '?'}${maquina ? ' · ' + maquina.nombre : ''} (sin asignar)`;
                porProducto[nombre] = porProducto[nombre] || { count: 0, monto: 0 };
                porProducto[nombre].count += unidadesDeVenta(v);
                porProducto[nombre].monto += parseFloat(v.monto_venta || 0);
            });
            return Object.entries(porProducto)
                .map(([nombre, d]) => ({ nombre, count: d.count, monto: d.monto }))
                .sort((a, b) => b.count - a.count || b.monto - a.monto)
                .slice(0, 5);
        }

        function getHoraMayorVenta() {
            const porHora = getVentasPorHora();
            let maxHora = 0;
            let maxMonto = 0;
            for (let hora in porHora) {
                if (porHora[hora] > maxMonto) {
                    maxMonto = porHora[hora];
                    maxHora = hora;
                }
            }
            return { hora: parseInt(maxHora), monto: maxMonto };
        }

        function getMaquinaMasProductiva() {
            const porMaquina = getVentasPorMaquina();
            let maxMaquina = '';
            let maxMonto = 0;
            for (let maquina in porMaquina) {
                if (porMaquina[maquina] > maxMonto) {
                    maxMonto = porMaquina[maquina];
                    maxMaquina = maquina;
                }
            }
            return { nombre: maxMaquina, monto: maxMonto };
        }

        // ============================================
        // IMPORTAR VENTAS DESDE EL REPORTE DE PAYSCAN (.xlsx o .csv)
        // ============================================
        const SHEETJS_URL = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
        const IMPORT_LOTE = 500;

        // Nombre de columna del reporte → campo interno (se compara sin tildes ni mayúsculas)
        const PAYSCAN_COLUMNAS = {
            id_transaccion: ['id transaccion'],
            fecha: ['fecha'],
            hora: ['hora'],
            resultado_transaccion: ['resultado transaccion'],
            monto_venta: ['total transaccion'],
            producto_codigo: ['producto'],
            serial_amit: ['serial amit'],
            serial_pos: ['serial pos'],
            comision: ['total comision'],
            neto_comision: ['neto comision'],
            iva_comision: ['iva comision'],
            metodo_pago: ['metodo de pago'],
            marca_tarjeta: ['marca tarjeta'],
            resultado_dispensado: ['resultado dispensado']
        };
        const PAYSCAN_OBLIGATORIAS = ['id_transaccion', 'fecha', 'monto_venta', 'producto_codigo', 'serial_amit'];

        function normHeader(h) {
            return String(h ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
        }

        function cargarScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = () => reject(new Error('No se pudo cargar el lector de Excel. Revisa tu conexión.'));
                document.head.appendChild(s);
            });
        }

        async function asegurarSheetJS() {
            if (typeof XLSX === 'undefined') await cargarScript(SHEETJS_URL);
        }

        // Montos: 1000 | "1000" | "1.000" | "$1.000" | "29,75" | "29.75"
        function parseMonto(v) {
            if (typeof v === 'number') return v;
            let t = String(v ?? '').replace(/[$\s]/g, '');
            if (!t) return 0;
            if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, '').replace(',', '.');
            else if (/^-?\d+,\d+$/.test(t)) t = t.replace(',', '.');
            const n = parseFloat(t);
            return isNaN(n) ? 0 : n;
        }

        function parseFechaImport(v) {
            if (v instanceof Date && !isNaN(v)) {
                return `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}`;
            }
            if (typeof v === 'number' && typeof XLSX !== 'undefined') {
                const d = XLSX.SSF.parse_date_code(v);
                if (d) return `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`;
            }
            const t = String(v ?? '').trim();
            let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (m) return `${m[1]}-${m[2]}-${m[3]}`;
            m = t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
            if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
            return '';
        }

        function parseHoraImport(v) {
            if (v instanceof Date && !isNaN(v)) {
                return [v.getHours(), v.getMinutes(), v.getSeconds()].map(x => String(x).padStart(2, '0')).join(':');
            }
            if (typeof v === 'number') {
                const tot = Math.round((v % 1) * 86400);
                return [Math.floor(tot / 3600), Math.floor((tot % 3600) / 60), tot % 60].map(x => String(x).padStart(2, '0')).join(':');
            }
            const m = String(v ?? '').trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);
            return m ? `${m[1].padStart(2, '0')}:${m[2]}:${m[3] || '00'}` : '00:00:00';
        }

        function textoONull(v) {
            const t = String(v ?? '').trim();
            return t ? t : null;
        }

        // Convierte una fila del reporte en una fila de la tabla ventas_payscan
        function mapFilaPayscan(fila, idx) {
            const get = campo => fila[idx[campo]];
            const fecha = parseFechaImport(get('fecha'));
            const hora = parseHoraImport(get('hora'));
            const serial = textoONull(get('serial_amit'));
            const maquina = serial !== null ? state.maquinas.find(m => normSerial(m.serial_amit) === normSerial(serial)) : null;
            return {
                id_transaccion: textoONull(get('id_transaccion')),
                fecha,
                hora,
                timestamp_completo: fecha ? `${fecha}T${hora}` : null,
                serial_amit: serial,
                serial_pos: textoONull(get('serial_pos')),
                maquina_id: maquina ? String(maquina.id) : null,
                espacio: decodeEspacioPayscan(get('producto_codigo')) || null,
                producto_codigo: textoONull(get('producto_codigo')),
                monto_venta: parseMonto(get('monto_venta')),
                comision: parseMonto(get('comision')),
                neto_comision: parseMonto(get('neto_comision')),
                iva_comision: parseMonto(get('iva_comision')),
                resultado_transaccion: (textoONull(get('resultado_transaccion')) || '').toUpperCase() || null,
                resultado_dispensado: textoONull(get('resultado_dispensado')),
                metodo_pago: textoONull(get('metodo_pago')),
                marca_tarjeta: textoONull(get('marca_tarjeta'))
            };
        }

        async function leerArchivoVentas(file) {
            await asegurarSheetJS();
            const esCsv = /\.csv$/i.test(file.name);
            const wb = esCsv
                ? XLSX.read(await file.text(), { type: 'string', raw: true })
                : XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
            // Hoja "Transacciones" o la primera
            const nombreHoja = wb.SheetNames.find(n => normHeader(n) === 'transacciones') || wb.SheetNames[0];
            const matriz = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], { header: 1, defval: null, raw: true, blankrows: false });
            // Buscar la fila de encabezados (la que tenga "ID transaccion")
            const filaEnc = matriz.findIndex(r => (r || []).some(c => normHeader(c) === 'id transaccion'));
            if (filaEnc < 0) throw new Error('No encontré la columna "ID transaccion". ¿Es el reporte de transacciones de PayScan?');
            const enc = matriz[filaEnc].map(normHeader);
            const idx = {};
            Object.entries(PAYSCAN_COLUMNAS).forEach(([campo, nombres]) => {
                const i = enc.findIndex(h => nombres.includes(h));
                if (i >= 0) idx[campo] = i;
            });
            const faltan = PAYSCAN_OBLIGATORIAS.filter(c => idx[c] === undefined);
            if (faltan.length) throw new Error('Faltan columnas en el archivo: ' + faltan.join(', '));
            return matriz.slice(filaEnc + 1)
                .filter(r => r && r[idx.id_transaccion])
                .map(r => mapFilaPayscan(r, idx));
        }

        async function idsYaImportados(ids) {
            const existentes = new Set();
            if (state.demoMode || !state.session) {
                state.ventas.forEach(v => { if (v.id_transaccion) existentes.add(String(v.id_transaccion)); });
                return existentes;
            }
            for (let i = 0; i < ids.length; i += 100) {
                const lote = ids.slice(i, i + 100);
                const { data, error } = await supabaseClient.from('ventas_payscan').select('id_transaccion').in('id_transaccion', lote);
                if (error) throw new Error('No se pudo verificar duplicados: ' + error.message);
                (data || []).forEach(r => existentes.add(String(r.id_transaccion)));
            }
            return existentes;
        }

        window.openImportModal = function() {
            state.showImportModal = true;
            state.importPreview = null;
            state.importError = '';
            render();

        window.closeImportModal = function() {
            if (state.importLoading) return;
            state.showImportModal = false;

        window.handleImportFile = async function(input) {
            const file = input && input.files && input.files[0];
            if (!file) return;
            state.importLoading = true;
            state.importError = '';
            state.importPreview = null;
            render();
            try {
                const filas = await leerArchivoVentas(file);
                const validas = filas.filter(f => f.id_transaccion && f.fecha);
                const invalidas = filas.length - validas.length;
                // Quitar repetidos dentro del mismo archivo
                const unicas = [...new Map(validas.map(f => [f.id_transaccion, f])).values()];
                const existentes = await idsYaImportados(unicas.map(f => f.id_transaccion));
                const nuevas = unicas.filter(f => !existentes.has(String(f.id_transaccion)));
                const aprobadas = nuevas.filter(f => f.resultado_transaccion === 'APPROVED');
                const fechas = unicas.map(f => f.fecha).sort();
                const porMaquina = {};
                const sinMaquina = new Set();
                aprobadas.forEach(f => {
                    const m = f.maquina_id ? state.maquinas.find(x => String(x.id) === f.maquina_id) : null;
                    const nombre = m ? m.nombre : `Serial ${normSerial(f.serial_amit)} (sin máquina)`;
                    if (!m) sinMaquina.add(f.serial_amit);
                    porMaquina[nombre] = porMaquina[nombre] || { count: 0, monto: 0 };
                    porMaquina[nombre].count++;
                    porMaquina[nombre].monto += f.monto_venta;
                });
                state.importPreview = {
                    archivo: file.name,
                    total: filas.length,
                    invalidas,
                    duplicadas: unicas.length - nuevas.length,
                    nuevas,
                    aprobadas: aprobadas.length,
                    otras: nuevas.length - aprobadas.length,
                    montoAprobado: aprobadas.reduce((s, f) => s + f.monto_venta, 0),
                    desde: fechas[0],
                    hasta: fechas[fechas.length - 1],
                    porMaquina,
                    sinMaquina: [...sinMaquina],
                    sinEspacio: nuevas.filter(f => !f.espacio).length
                };
            } catch (err) {
                console.error(err);
                state.importError = err.message || 'No se pudo leer el archivo.';
            } finally {
                state.importLoading = false;
                render();
            }
        };

        window.confirmarImport = async function() {
            const prev = state.importPreview;
            if (!prev || !prev.nuevas.length) return;
            if (!puedeEscribir()) return;
            state.importLoading = true;
            state.importError = '';
            render();
            let insertadas = 0;
            try {
                for (let i = 0; i < prev.nuevas.length; i += IMPORT_LOTE) {
                    const lote = prev.nuevas.slice(i, i + IMPORT_LOTE);
                    // ignoreDuplicates: si alguna ya existe (otro usuario importó recién), se omite sin error
                    const { error } = await supabaseClient
                        .from('ventas_payscan')
                        .upsert(lote, { onConflict: 'id_transaccion', ignoreDuplicates: true });
                    if (error) throw new Error(`Error en el lote ${i / IMPORT_LOTE + 1}: ${error.message}`);
                    insertadas += lote.length;
                }
                guardarHistorial('IMPORTAR_VENTAS', `${prev.archivo}: ${insertadas} transacciones nuevas (${fmtFecha(prev.desde)} al ${fmtFecha(prev.hasta)})`);
                state.importLoading = false;
                state.showImportModal = false;
                state.importPreview = null;
                state.periodo = 'ultimo';
                await fetchVentas();
                render();
                alert(`✅ ${insertadas} transacciones importadas`);
            } catch (err) {
                console.error(err);
                state.importLoading = false;
                state.importError = err.message + (insertadas ? ` (se alcanzaron a guardar ${insertadas}; puedes volver a importar el mismo archivo, no se duplicarán)` : '');
                render();
            }
        };

            const p = state.importPreview;
            return `

        // ============================================
        // PLANILLA DE INVENTARIO (descargar → completar en Excel → cargar)

        function nombreHoja(nombre, usados) {
            let n = String(nombre || 'Máquina').replace(/[\[\]:*?\/\\]/g, ' ').trim().substring(0, 31) || 'Máquina';
            let k = 2; const base = n;
            while (usados.has(n)) n = (base.substring(0, 28) + ' ' + k++);
            usados.add(n); return n;
        }

        window.descargarPlanillaInventario = async function() {
            try {
                await asegurarSheetJS();
                const wb = XLSX.utils.book_new();
                const usados = new Set(['Instrucciones', 'Bodega']);

                    ['PLANILLA DE INVENTARIO GO BOX'],

                    [],
                    ['Familias válidas: Snacks, Bebidas, Confites, Dulces, Proteína (u otra que ya uses)'],
                ];
                const wsI = XLSX.utils.aoa_to_sheet(instr); wsI['!cols'] = [{ wch: 120 }];
                XLSX.utils.book_append_sheet(wb, wsI, 'Instrucciones');

                const enMaquinas = {};
                state.asignaciones.forEach(a => { enMaquinas[a.sku] = (enMaquinas[a.sku] || 0) + (Number(a.cantidad_asignada) || 0); });
                const bod = [['SKU', 'Producto', 'Familia', 'Stock bodega', 'Precio compra', 'Precio venta', 'Fecha caducidad (AAAA-MM-DD)', 'Proveedor', 'En máquinas (referencia)']];
                state.inventario.slice()
                    .sort((a, b) => String(a.familia).localeCompare(String(b.familia)) || String(a.nombre_producto).localeCompare(String(b.nombre_producto)))
                    .forEach(p => bod.push([p.sku, p.nombre_producto, p.familia, Number(p.cantidad_actual) || 0, Number(p.precio_compra_unitario) || 0,
                        Number(p.precio_venta_unitario) || 0, p.fecha_caducidad ? String(p.fecha_caducidad).substring(0, 10) : '', p.proveedor || '', enMaquinas[p.sku] || 0]));
                const wsB = XLSX.utils.aoa_to_sheet(bod);
                wsB['!cols'] = [{ wch: 30 }, { wch: 34 }, { wch: 12 }, { wch: 13 }, { wch: 13 }, { wch: 13 }, { wch: 26 }, { wch: 22 }, { wch: 22 }];
                XLSX.utils.book_append_sheet(wb, wsB, 'Bodega');

                state.maquinas.slice().sort((a, b) => String(a.id).localeCompare(String(b.id))).forEach(m => {

                    const rows = [['Máquina', m.nombre, 'ID', m.id], [], ['Espacio', 'Bandeja', 'Posición', 'SKU', 'Producto', 'Precio', 'Capacidad', 'Cantidad actual']];
                    for (let f = 1; f <= filas; f++) for (let c = 1; c <= cols; c++) {
                        const e = codigoEspacio(f, c);
                        const a = getAsignacion(m.id, e);
                        const prod = a ? state.inventario.find(p => String(p.sku) === String(a.sku)) : null;
                        rows.push([Number(e), f, c, a ? a.sku : '', a ? (prod ? prod.nombre_producto : a.sku) : '(sin producto)',
                            a ? Number(a.precio_venta_espacio) || '' : '', capacidadEspacio(m, e) || '', a ? Number(a.cantidad_asignada) || 0 : '']);
                    }
                    const ws = XLSX.utils.aoa_to_sheet(rows);
                    ws['!cols'] = [{ wch: 9 }, { wch: 9 }, { wch: 9 }, { wch: 30 }, { wch: 34 }, { wch: 9 }, { wch: 11 }, { wch: 15 }];
                    XLSX.utils.book_append_sheet(wb, ws, nombreHoja(m.nombre, usados));
                });
                XLSX.writeFile(wb, `inventario_gobox_${fechaLocal()}.xlsx`);
                guardarHistorial('DESCARGAR_PLANILLA_INVENTARIO', `${state.inventario.length} productos, ${state.maquinas.length} máquinas`);
            } catch (err) {
                console.error(err);
                alert('❌ No se pudo generar la planilla: ' + err.message);
            }
        };

        window.openInvModal = function() { state.showInvModal = true; state.invPreview = null; state.invError = ''; render(); };
        window.closeInvModal = function() { if (state.invLoading) return; state.showInvModal = false; state.invPreview = null; state.invError = ''; render(); };

        function enteroONull(v) {
            if (v === null || v === undefined || String(v).trim() === '') return null;
            const n = Math.round(parseMonto(v));
            return isNaN(n) ? null : n;
        }

        async function leerPlanillaInventario(file) {
            await asegurarSheetJS();
            const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
            const prev = { productos: [], nuevos: [], capacidades: [], cantidades: [], avisos: [], errores: [] };
            const aoa = n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: null, raw: true, blankrows: false });

            // --- Bodega ---
            const hojaB = wb.SheetNames.find(n => normHeader(n) === 'bodega');
            if (hojaB) {
                const m = aoa(hojaB);
                const hi = m.findIndex(r => (r || []).some(c => normHeader(c) === 'sku'));
                if (hi >= 0) {
                    const enc = m[hi].map(normHeader);
                    const col = nombre => enc.findIndex(h => h.startsWith(nombre));
                    const ix = { sku: col('sku'), nombre: col('producto'), familia: col('familia'), stock: col('stock bodega'), pc: col('precio compra'), pv: col('precio venta'), cad: col('fecha caducidad'), prov: col('proveedor') };
                    m.slice(hi + 1).forEach((r, i) => {
                        const sku = textoONull(r[ix.sku]); if (!sku) return;
                        const fila = hi + i + 2;
                        const p = state.inventario.find(x => String(x.sku) === sku);
                        const stock = ix.stock >= 0 ? enteroONull(r[ix.stock]) : null;
                        const pc = ix.pc >= 0 ? enteroONull(r[ix.pc]) : null;
                        const pv = ix.pv >= 0 ? enteroONull(r[ix.pv]) : null;
                        const cadTxt = ix.cad >= 0 ? r[ix.cad] : null;
                        const cad = cadTxt === null || String(cadTxt).trim() === '' ? null : parseFechaImport(cadTxt);
                        const prov = ix.prov >= 0 ? (textoONull(r[ix.prov]) || '') : null;
                        if ([stock, pc, pv].some(x => x !== null && x < 0)) { prev.errores.push(`Bodega fila ${fila} (${sku}): hay valores negativos`); return; }
                        if (cadTxt !== null && String(cadTxt).trim() !== '' && !cad) { prev.errores.push(`Bodega fila ${fila} (${sku}): fecha de caducidad no válida "${cadTxt}"`); return; }
                        if (!p) {
                            const nombre = textoONull(r[ix.nombre]); const familia = textoONull(r[ix.familia]);
                            if (!nombre || !familia) { prev.errores.push(`Bodega fila ${fila}: SKU nuevo "${sku}" necesita Producto y Familia`); return; }
                            prev.nuevos.push({ sku, nombre_producto: nombre, familia, cantidad_actual: stock || 0, precio_compra_unitario: pc || 0, precio_venta_unitario: pv || 0, fecha_compra: fechaLocal(), fecha_caducidad: cad, proveedor: prov || null, notas: 'Creado desde planilla de inventario' });
                            return;
                        }
                        const cambios = {};
                        if (stock !== null && stock !== (Number(p.cantidad_actual) || 0)) cambios.cantidad_actual = stock;
                        if (pc !== null && pc !== (Number(p.precio_compra_unitario) || 0)) cambios.precio_compra_unitario = pc;
                        if (pv !== null && pv !== (Number(p.precio_venta_unitario) || 0)) cambios.precio_venta_unitario = pv;
                        const cadActual = p.fecha_caducidad ? String(p.fecha_caducidad).substring(0, 10) : null;
                        if (ix.cad >= 0 && cad !== cadActual) cambios.fecha_caducidad = cad;
                        if (prov !== null && prov !== (p.proveedor || '')) cambios.proveedor = prov;
                        if (Object.keys(cambios).length) prev.productos.push({ id: p.id, sku, nombre: p.nombre_producto, antes: Number(p.cantidad_actual) || 0, cambios });
                    });
                } else prev.avisos.push('La hoja "Bodega" no tiene la fila de títulos (SKU…); se omitió.');
            } else prev.avisos.push('No se encontró la hoja "Bodega"; solo se leerán las máquinas.');

            // --- Máquinas ---
            wb.SheetNames.forEach(n => {
                const m = aoa(n);
                const r0 = m[0] || [];
                if (normHeader(r0[0]) !== 'maquina') return;
                const maq = state.maquinas.find(x => String(x.id) === String(r0[3])) || state.maquinas.find(x => x.nombre === r0[1]);
                if (!maq) { prev.errores.push(`Hoja "${n}": la máquina ${r0[1]} (${r0[3]}) no existe en el sistema`); return; }
                const hi = m.findIndex(r => (r || []).some(c => normHeader(c) === 'espacio'));
                if (hi < 0) return;
                const enc = m[hi].map(normHeader);
                const iE = enc.indexOf('espacio'), iCap = enc.indexOf('capacidad'), iCant = enc.indexOf('cantidad actual');
                const caps = getCapacidades(maq);
                const nuevasCaps = { ...caps };
                let cambioCap = 0;
                const filas = maq.total_filas || 6, cols = maq.total_columnas || 10;
                m.slice(hi + 1).forEach(r => {
                    const e = normEspacio(r[iE]); if (!e || isNaN(Number(e))) return;
                    const n2 = Number(e), b = Math.floor((n2 - 1) / POSICIONES_TCN) + 1, pos = ((n2 - 1) % POSICIONES_TCN) + 1;
                    if (b > filas || pos > cols) { prev.avisos.push(`${maq.nombre}: espacio ${e} no existe en la configuración (${filas}×${cols}); se omitió`); return; }
                    const cap = iCap >= 0 ? enteroONull(r[iCap]) : null;
                    const cant = iCant >= 0 ? enteroONull(r[iCant]) : null;
                    if ((cap !== null && cap < 0) || (cant !== null && cant < 0)) { prev.errores.push(`${maq.nombre} espacio ${e}: valores negativos`); return; }
                    if (cap !== null && cap !== (parseInt(caps[e], 10) || 0)) {
                        if (cap > 0) nuevasCaps[e] = cap; else delete nuevasCaps[e];
                        cambioCap++;
                    }
                    const capFinal = parseInt(nuevasCaps[e], 10) || null;
                    if (cant !== null) {
                        const a = getAsignacion(maq.id, e);
                        if (!a) { if (cant > 0) prev.avisos.push(`${maq.nombre} espacio ${e}: tiene cantidad ${cant} pero no tiene producto asignado; se omitió`); return; }
                        if (capFinal && cant > capFinal) prev.avisos.push(`${maq.nombre} espacio ${e}: cantidad ${cant} supera la capacidad ${capFinal}`);
                        if (cant !== (Number(a.cantidad_asignada) || 0)) prev.cantidades.push({ id: a.id, maquina: maq.nombre, espacio: e, sku: a.sku, antes: Number(a.cantidad_asignada) || 0, despues: cant });
                    }
                });
                if (cambioCap) prev.capacidades.push({ id: maq.id, maquina: maq.nombre, n: cambioCap, json: JSON.stringify(nuevasCaps), total: Object.values(nuevasCaps).reduce((t, x) => t + (parseInt(x, 10) || 0), 0) });
            });
            prev.archivo = file.name;
            prev.totalCambios = prev.productos.length + prev.nuevos.length + prev.capacidades.length + prev.cantidades.length;
            return prev;
        }

        window.handleInventarioFile = async function(input) {
            const file = input && input.files && input.files[0];
            if (!file) return;
            state.invLoading = true; state.invError = ''; state.invPreview = null; render();
            try { state.invPreview = await leerPlanillaInventario(file); }
            catch (err) { console.error(err); state.invError = err.message || 'No se pudo leer el archivo.'; }
            finally { state.invLoading = false; render(); }
        };

        async function enLotes(items, fn, tam = 8) {
            for (let i = 0; i < items.length; i += tam) {
                const res = await Promise.all(items.slice(i, i + tam).map(fn));
                const err = res.find(r => r && r.error);
                if (err) throw new Error(err.error.message);
            }
        }

        window.confirmarInventario = async function() {
            const pv = state.invPreview;
            if (!pv || !pv.totalCambios || pv.errores.length) return;
            if (!puedeEscribir()) return;
            state.invLoading = true; state.invError = ''; render();
            try {
                await enLotes(pv.productos, x => supabaseClient.from('inventario_bodega').update(x.cambios).eq('id', x.id));
                if (pv.nuevos.length) { const { error } = await supabaseClient.from('inventario_bodega').insert(pv.nuevos); if (error) throw new Error(error.message); }
                await enLotes(pv.capacidades, x => supabaseClient.from('maquinas').update({ capacidad_por_espacio: x.json }).eq('id', x.id));
                await enLotes(pv.cantidades, x => supabaseClient.from('asignaciones_maquina').update({ cantidad_asignada: x.despues, fecha_asignacion: fechaLocal() }).eq('id', x.id));
                guardarHistorial('CARGAR_PLANILLA_INVENTARIO', `${pv.archivo}: ${pv.productos.length} productos actualizados, ${pv.nuevos.length} nuevos, ${pv.capacidades.length} máquinas con capacidades, ${pv.cantidades.length} espacios con cantidad`);
                state.invLoading = false; state.showInvModal = false; state.invPreview = null;
                await fetchAllData();
                alert('✅ Inventario actualizado');
            } catch (err) {
                console.error(err);
                state.invLoading = false;
                state.invError = 'Error al guardar: ' + err.message + '. Puedes volver a cargar la misma planilla: solo se aplicará lo que falte.';
                render();
            }
        };

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Top 5 Productos Vendidos -->
                        <div class="bg-white p-6 rounded-lg shadow-md">
