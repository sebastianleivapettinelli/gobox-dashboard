        function createOfflineClient() {
            const fail = { data: null, error: { message: 'Supabase no disponible (sin conexión)' } };
            const chain = new Proxy(function () {}, {
                get: (target, prop) => prop === 'then' ? (resolve) => resolve(fail) : chain,
                apply: () => chain
            });
            return {
                from: () => chain,
                auth: {
                    getSession: async () => ({ data: { session: null }, error: null }),
                    onAuthStateChange: () => ({ data: { subscription: { unsubscribe() {} } } }),

        // ============================================
        // Fecha local (Chile) en formato YYYY-MM-DD. toISOString() usa UTC y
        // después de las 21:00 hrs devolvía la fecha de "mañana".
        function fechaLocal(offsetDias = 0) {
            const d = new Date();
            d.setDate(d.getDate() + offsetDias);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        // Escapa texto antes de insertarlo en HTML (evita que comillas o < > rompan la vista)
        function esc(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Formatea montos CLP sin reventar si el valor viene null/string
        function clp(value, opts = {}) {
            return (Number(value) || 0).toLocaleString('es-CL', { maximumFractionDigits: 0, ...opts });
        }

        function emptyProduct() {

        }

        // ============================================
        // NUMERACIÓN DE ESPACIOS (verificada con el reporte real de PayScan)
        // Máquina TCN: bandejas de 10 posiciones. espacio = (bandeja − 1) × 10 + posición
        // Bandeja 1 = 1..10, Bandeja 2 = 11..20, ..., Bandeja 6 = 51..60
        // PayScan lo informa en la columna "Producto" en hexadecimal: '3800' o '0038' = 0x38 = 56
        // ============================================
        const MAX_FILAS = 9;          // bandejas
        const MAX_COLUMNAS = 10;      // posiciones por bandeja (numeración TCN de 10 en 10)
        const POSICIONES_TCN = 10;

        function codigoEspacio(bandeja, posicion) {
            return String((bandeja - 1) * POSICIONES_TCN + posicion);
        }

        // Normaliza el espacio: 12, '12', '012' → '12'. Formato antiguo del dashboard '0102' (fila 1, col 2) → '2'
        function normEspacio(value) {
            if (value === null || value === undefined) return '';
            const txt = String(value).trim();
            if (/^\d{4}$/.test(txt)) {
                return codigoEspacio(parseInt(txt.substring(0, 2), 10), parseInt(txt.substring(2, 4), 10));
            }
            const n = parseInt(txt, 10);
            return isNaN(n) ? txt : String(n);
        }

        // Código "Producto" de PayScan → número de espacio
        function decodeEspacioPayscan(code) {
            const txt = String(code ?? '').trim().toUpperCase();
            if (/^[0-9A-F]{4}$/.test(txt)) {
                const alto = parseInt(txt.substring(0, 2), 16);
                const bajo = parseInt(txt.substring(2, 4), 16);
                const n = alto || bajo;
                return n ? String(n) : '';
            }
            if (/^\d{1,2}$/.test(txt)) return String(parseInt(txt, 10));
            return '';
        }

        function describeEspacio(codigo) {
            const n = parseInt(codigo, 10);
            if (isNaN(n) || n < 1) return `Espacio ${esc(codigo)}`;
            return `Espacio ${n} (Bandeja ${Math.floor((n - 1) / POSICIONES_TCN) + 1} · Posición ${((n - 1) % POSICIONES_TCN) + 1})`;
        }

        function buildCapacidades(filas, columnas, porSlot) {
            const caps = {};
            for (let f = 1; f <= (filas || 0); f++) {
                for (let c = 1; c <= (columnas || 0); c++) {
                    caps[codigoEspacio(f, c)] = porSlot || 1;
                }
            }
            return caps;
        }

        // Serial sin ceros a la izquierda: '0000000000440864' → '440864', '0' → '0'
        function normSerial(v) {
            const t = String(v ?? '').trim();
            return t.replace(/^0+(?=.)/, '');
        }

        // Una venta puede traer maquina_id o solo el serial del PayScan
        function getMaquinaDeVenta(v) {
            if (v.maquina_id) {
                const m = state.maquinas.find(m => String(m.id) === String(v.maquina_id));
                if (m) return m;
            }
            if (v.serial_amit !== undefined && v.serial_amit !== null && v.serial_amit !== '') {
                return state.maquinas.find(m => normSerial(m.serial_amit) === normSerial(v.serial_amit)) || null;
            }
            return null;
        }

        function getAsignacion(maquinaId, espacio) {
            const cod = normEspacio(espacio);
            return state.asignaciones.find(a => String(a.maquina_id) === String(maquinaId) && normEspacio(a.espacio) === cod) || null;
        }

        // Producto vendido: por código del producto o, si PayScan no lo trae, por lo asignado en ese espacio
        function getProductoDeVenta(v) {

            if (maquina && v.espacio !== undefined && v.espacio !== null) {

                if (asig) return state.inventario.find(p => String(p.sku) === String(asig.sku)) || null;

            return null;

                { id: 'a3', maquina_id: '6ba7b810-9dad-11d1-80b4-00c04fd430c8', espacio: '33', sku: 'SKU002', cantidad_asignada: 8, productos_por_slot: 1, precio_venta_espacio: 2200 }

        async function fetchAllData() {
            if (state.demoMode) { loadMockData(); render(); return; }
            if (!state.session) { render(); return; } // sin sesión no se consulta nada
            state.loading = true;
            state.loadError = null;
            render();
            try {
                const results = await Promise.allSettled([
                    fetchVentas(),
                    fetchInventario(),
                    fetchAsignaciones(),
                    fetchMaquinas(),
                    fetchHistorial()
                ]);
                // En producción NO se muestran datos inventados: si algo falla se avisa.
                const fallidas = ['Ventas', 'Inventario', 'Asignaciones', 'Máquinas']
                    .filter((_, i) => !(results[i].status === 'fulfilled' && results[i].value === true));
                if (fallidas.length) state.loadError = `No se pudieron cargar: ${fallidas.join(', ')}. Revisa tu conexión o las políticas de Supabase.`;
            } catch (err) {
                console.error('Error cargando datos:', err);
                state.loadError = 'Error inesperado al cargar datos.';
            } finally {
                state.loading = false;
                render(); // render() ya inicializa los gráficos del dashboard
            }
        }

        // Cada fetch devuelve true si la consulta a Supabase fue exitosa
        async function fetchVentas() {
            try {
                // Últimos ~2 meses (para comparar 30 días vs 30 anteriores). Supabase entrega máx. 1000 filas
                // por consulta, así que se pide por páginas.
                const desde = fechaLocal(-62);
                let todas = [];
                for (let from = 0; from < 50000; from += 1000) {
                    const { data, error } = await supabaseClient
                        .from('ventas_payscan')
                        .select('*')
                        .gte('fecha', desde)
                        .order('timestamp_completo', { ascending: false })
                        .range(from, from + 999);
                    if (error) throw error;
                    todas = todas.concat(data || []);
                    if (!data || data.length < 1000) break;
                }
                state.ventas = todas;
                return true;
            } catch (err) {
                console.warn('⚠️ No se pudo conectar con ventas:', err.message);
                state.ventas = [];
                return false;
            }
        }

        async function fetchInventario() {
            const { data, error } = await supabaseClient.from('inventario_bodega').select('*').order('fecha_caducidad', { ascending: true });
            if (error) { console.error('Error fetching inventario:', error); return false; }
            state.inventario = data || [];

        // Historial ahora vive en Supabase (tabla historial_cambios): compartido entre tus dispositivos
        // y socios, y no se puede editar ni borrar desde el dashboard (auditoría real).
        async function fetchHistorial() {
            const { data, error } = await supabaseClient
                .from('historial_cambios')
                .select('created_at, usuario, accion, detalles')
                .order('created_at', { ascending: false })
                .limit(100);
            if (error) { console.warn('Historial no disponible:', error.message); state.historial = []; return false; }
            state.historial = (data || []).map(h => ({ timestamp: h.created_at, usuario: h.usuario, accion: h.accion, detalles: h.detalles }));
            return true;
        }

        function guardarHistorial(accion, detalles) {
            const registro = {
                timestamp: new Date().toISOString(),
                usuario: state.currentUser,
                accion: accion,
                detalles: detalles
            };
            state.historial.unshift(registro);
            state.historial = state.historial.slice(0, 100);
            if (state.demoMode || !state.session) return;
            // Se registra en segundo plano; user_id lo asigna la base de datos (auth.uid())
            supabaseClient.from('historial_cambios')
                .insert([{ usuario: state.currentUser, accion, detalles: String(detalles).slice(0, 500) }])
                .then(({ error }) => { if (error) console.warn('No se pudo registrar en historial:', error.message); });
        }

        function setSession(session) {

        // Borra tokens de sesión guardados en este navegador (útil si quedaron corruptos)
        window.limpiarSesionGuardada = function() {
            try {
                Object.keys(localStorage).filter(k => k.startsWith('sb-') || k.includes('supabase')).forEach(k => localStorage.removeItem(k));
            } catch (e) {}
            state.loginError = 'Sesión guardada eliminada. Intenta ingresar de nuevo.';
            state.loginDetalle = '';
            state.loginLoading = false;
            render();
        };

        window.updateLoginField = function(field, value) {
            state.loginForm[field] = value;
        };

        window.handleLogin = async function() {
            if (state.loginLoading) return;
            const email = state.loginForm.email.trim().toLowerCase();
            const password = state.loginForm.password;

            const restante = Math.ceil((state.loginBlockedUntil - Date.now()) / 1000);
            if (restante > 0) {
                state.loginError = `Demasiados intentos. Espera ${restante} s.`;
                render();
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || !password) {
                state.loginError = 'Ingresa un correo válido y tu contraseña.';
                render();
                return;
            }

            state.loginLoading = true;
            state.loginError = '';
            render();

            let data = null, error = null;
            try {
                const limite = new Promise((_, rej) => setTimeout(() => rej(new Error('Supabase no respondió en 25 segundos')), 25000));
                ({ data, error } = await Promise.race([supabaseClient.auth.signInWithPassword({ email, password }), limite]));
            } catch (e) {
                error = e;
            } finally {
                state.loginLoading = false;
            }
            if (error) console.error('Login error:', error);
            state.loginDetalle = error ? [error.status, error.code, error.name, error.message].filter(Boolean).join(' · ') : '';

            if (error || !data || !data.session) {
                state.loginFails++;
                if (state.loginFails >= LOGIN_MAX_INTENTOS) {
                    state.loginBlockedUntil = Date.now() + LOGIN_BLOQUEO_SEG * 1000;
                    state.loginFails = 0;
                    setTimeout(() => { state.loginError = ''; render(); }, LOGIN_BLOQUEO_SEG * 1000 + 200);
                }
                // Mensaje genérico: no revela si el correo existe
                const msg = String(error && error.message || '');
                state.loginError = /invalid login credentials/i.test(msg) ? 'Correo o contraseña incorrectos.'
                    : /email not confirmed/i.test(msg) ? 'El usuario no está confirmado. En Supabase → Authentication → Users, confírmalo (o créalo con "Auto Confirm User").'
                    : /fetch|network|abort|respondi|disponible|timeout/i.test(msg) ? 'No hay respuesta del servidor. Revisa tu conexión o que el proyecto de Supabase esté activo.'
                    : 'No se pudo iniciar sesión.';
                state.loginForm.password = '';
                render();
                return;
            }

            state.loginFails = 0;
            state.loginForm = { email: '', password: '' };
            setSession(data.session);
            marcarActividad();
            guardarHistorial('LOGIN', `Inicio de sesión`);
            await fetchAllData();
        };

            if (!motivo && !confirm('¿Cerrar sesión?')) return;
            if (state.demoMode) { window.location.href = window.location.pathname; return; }
            // Registrar ANTES de cerrar (después ya no hay permiso para escribir)
            if (state.session) {
                await supabaseClient.from('historial_cambios')
                    .insert([{ usuario: state.currentUser, accion: 'LOGOUT', detalles: motivo || 'Sesión cerrada' }])
                    .then(() => {}, () => {});
            }
            await supabaseClient.auth.signOut();
            setSession(null);
            limpiarDatos();
            state.loginError = motivo ? 'Sesión cerrada por inactividad.' : '';
            render();

        function getFilteredInventario() {
            return state.inventario.filter(p => {
                const matchSearch = !state.searchQuery || String(p.sku || '').toLowerCase().includes(state.searchQuery) || String(p.nombre_producto || '').toLowerCase().includes(state.searchQuery);
                const matchFamilia = state.filterFamilia === 'Todos' || p.familia === state.filterFamilia;
                const matchProveedor = state.filterProveedor === 'Todos' || p.proveedor === state.filterProveedor;
                
                let matchEstado = true;
                if (state.filterEstado === 'Bajo Stock') matchEstado = (Number(p.cantidad_actual) || 0) < STOCK_CRITICO;
                else if (state.filterEstado === 'Por Vencer') {
                    if (!p.fecha_caducidad) return false;
                    const venc = new Date(p.fecha_caducidad);
                    const hoy = new Date();
                    const dias = (venc - hoy) / (1000 * 60 * 60 * 24);
                    matchEstado = dias < 30 && dias > 0;
                }

                return matchSearch && matchFamilia && matchProveedor && matchEstado;
            });
        }

        // ============================================
        // REPORTES
        // ============================================
        window.exportarInventarioCSV = function() {
            const filtered = getFilteredInventario();
            // Separador ";" y BOM UTF-8 → Excel en español abre columnas y tildes correctamente
            const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
            let csv = 'SKU;Nombre;Familia;Cantidad;Precio Compra;Precio Venta;Vencimiento;Proveedor\n';

            filtered.forEach(p => {
                csv += [q(p.sku), q(p.nombre_producto), q(p.familia), Number(p.cantidad_actual) || 0, Number(p.precio_compra_unitario) || 0, Number(p.precio_venta_unitario) || 0, q(p.fecha_caducidad), q(p.proveedor)].join(';') + '\n';
            });

            const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `inventario_${fechaLocal()}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            guardarHistorial('EXPORTAR_CSV', `${filtered.length} productos`);
        };

        function onBarcodeDetected(result) {
            if (result && result.codeResult && result.codeResult.code) {
                const barcode = result.codeResult.code;
                stopScanner();
                state.detectedBarcode = barcode;
                const existingProduct = state.inventario.find(p => String(p.sku) === String(barcode));
                state.scannedProductData = existingProduct || { sku: barcode, nombre_producto: '', familia: 'Snacks', proveedor: '' };
                render();
            }
        }

        function initializeScanner() {
            if (state.scannerActive) return;
            const scanner = document.getElementById('scanner');
            if (!scanner) return; // antes se marcaba activo antes de validar y quedaba bloqueado
            if (typeof Quagga === 'undefined') { alert('No se pudo cargar el lector de códigos'); return; }
            state.scannerActive = true;

            Quagga.init({
                inputStream: {
                    name: 'Live',
                    type: 'LiveStream',
                    target: scanner,
                    constraints: { width: { min: 300 }, height: { min: 300 }, facingMode: 'environment' }
                },
                decoder: {
                    workers: 2,
                    multiple: false,
                    readers: ['ean_reader', 'upc_reader', 'code128_reader', 'code39_reader']
                }
            }, function(err) {
                if (err) {
                    console.error('Quagga init error:', err);
                    alert('Error al acceder a la cámara (requiere HTTPS y permiso de cámara)');
                    state.scannerActive = false;
                    return;
                }
                // Evitar acumular listeners en cada "Escanear Otro"
                Quagga.offDetected(onBarcodeDetected);
                Quagga.onDetected(onBarcodeDetected);
                Quagga.start();
            });
        }

        function stopScanner() {
            if (state.scannerActive) {
                try {
                    Quagga.offDetected(onBarcodeDetected);
                    Quagga.stop();
                } catch (e) {
                    console.log('Scanner already stopped');
                }
                state.scannerActive = false;
            }
        }

                // '' no es una fecha válida para Postgres → se envía null

            }]);

            if (error) { console.error('Error:', error); alert('❌ Error al agregar producto: ' + error.message); }

        window.deleteProduct = async function(productId) {

        window.setTab = function(tabName) {
            state.activeTab = tabName;
            render();
        };

        // ============================================
        // FUNCIONES DE CÁLCULO PARA DASHBOARD (FASE 1)
        // ============================================
        const STOCK_CRITICO = 5; // unidades bajo las cuales se considera stock crítico

        // FALTABA: renderDashboard() la llamaba y lanzaba ReferenceError → el Dashboard no cargaba
        function getStockCritico() {
            return state.inventario
                .filter(p => (Number(p.cantidad_actual) || 0) < STOCK_CRITICO)
                .sort((a, b) => (Number(a.cantidad_actual) || 0) - (Number(b.cantidad_actual) || 0))
                .slice(0, 10);
        }

        // Solo ventas aprobadas (si la columna existe)
        function esVentaValida(v) {
            return !v.resultado_transaccion || String(v.resultado_transaccion).toUpperCase() === 'APPROVED';
        }

        function fechaDeVenta(v) {
            if (v.fecha) return String(v.fecha).substring(0, 10);
            if (v.timestamp_completo) return String(v.timestamp_completo).substring(0, 10);
            return '';
        }

        // ============================================
        // PERÍODO DE ANÁLISIS
        // Como las ventas se importan manualmente desde PayScan, "hoy" casi siempre estaría vacío.
        // Por defecto se muestra el último día con ventas importadas.
        // ============================================
        const PERIODOS = {
            ultimo: 'Último día con datos',
            hoy: 'Hoy',
            '7d': 'Últimos 7 días',
            '30d': 'Últimos 30 días'
        };

        function addDias(fechaStr, n) {
            const [y, m, d] = fechaStr.split('-').map(Number);
            const dt = new Date(Date.UTC(y, m - 1, d + n));
            return dt.toISOString().substring(0, 10);
        }

        function fmtFecha(fechaStr) {
            if (!fechaStr) return '—';
            const [y, m, d] = String(fechaStr).substring(0, 10).split('-');
            return `${d}-${m}-${y}`;
        }

        function getUltimaFechaConVentas() {
            let max = '';
            state.ventas.forEach(v => { if (esVentaValida(v)) { const f = fechaDeVenta(v); if (f > max) max = f; } });
            return max;
        }

        function getUltimaVenta() {
            let max = null;
            state.ventas.forEach(v => {
                const ts = v.timestamp_completo ? String(v.timestamp_completo) : `${fechaDeVenta(v)}T${v.hora || '00:00:00'}`;
                if (!max || ts > max) max = ts;
            });
            return max;
        }

        function getRangoPeriodo() {
            const periodo = state.periodo || 'ultimo';
            const ancla = periodo === 'hoy' ? fechaLocal() : (getUltimaFechaConVentas() || fechaLocal());
            const dias = periodo === '7d' ? 7 : periodo === '30d' ? 30 : 1;
            const hasta = ancla;
            const desde = addDias(ancla, -(dias - 1));
            const prevHasta = addDias(desde, -1);
            const prevDesde = addDias(prevHasta, -(dias - 1));
            const label = dias === 1 ? fmtFecha(desde) : `${fmtFecha(desde)} al ${fmtFecha(hasta)}`;
            const prevLabel = dias === 1 ? fmtFecha(prevDesde) : `${fmtFecha(prevDesde)} al ${fmtFecha(prevHasta)}`;
            return { periodo, dias, desde, hasta, prevDesde, prevHasta, label, prevLabel };
        }

        function ventasEntre(desde, hasta) {
            return state.ventas.filter(v => { const f = fechaDeVenta(v); return f >= desde && f <= hasta && esVentaValida(v); });
        }

        function getVentasPeriodo() {
            const r = getRangoPeriodo();
            return ventasEntre(r.desde, r.hasta);
        }

        function getVentasPeriodoAnterior() {
            const r = getRangoPeriodo();
            return ventasEntre(r.prevDesde, r.prevHasta);
        }

        const sumaMontos = arr => arr.reduce((sum, v) => sum + parseFloat(v.monto_venta || 0), 0);

        // Una transacción puede incluir varias unidades (ej: $3.900 = 3 × $1.300)
        function unidadesDeVenta(v) {
            const maquina = getMaquinaDeVenta(v);
            const asig = maquina ? getAsignacion(maquina.id, v.espacio) : null;
            let precio = asig ? Number(asig.precio_venta_espacio) : 0;
            if (!precio && asig) {
                const prod = state.inventario.find(p => String(p.sku) === String(asig.sku));
                precio = prod ? Number(prod.precio_venta_unitario) : 0;
            }
            const monto = Number(v.monto_venta) || 0;
            if (precio > 0 && monto >= precio * 2 && monto % precio === 0) return monto / precio;
            return 1;
        }

        function getComparativa() {
            const actual = sumaMontos(getVentasPeriodo());
            const anterior = sumaMontos(getVentasPeriodoAnterior());
            if (anterior === 0) return { porcentaje: 0, estado: 'sin_comparar', monto_hoy: actual, monto_ayer: anterior };
            const cambio = ((actual - anterior) / anterior) * 100;
            return {
                porcentaje: cambio.toFixed(1),
                estado: cambio > 0 ? 'positivo' : cambio < 0 ? 'negativo' : 'igual',
                monto_hoy: actual,
                monto_ayer: anterior
            };
        }

        // Alias usados por el resto del código
        const getVentasHoy = getVentasPeriodo;
        const getTotalVentasHoy = () => sumaMontos(getVentasPeriodo());
        const getTransaccionesHoy = () => getVentasPeriodo().length;
        function getTicketPromedio() {
            const v = getVentasPeriodo();
            return v.length ? sumaMontos(v) / v.length : 0;
        }
        const getComparativaHoyVsAyer = getComparativa;

        function getVentasPorHora() {
            const ventas = getVentasPeriodo();
            const porHora = {};
            for (let i = 0; i < 24; i++) porHora[i] = 0;
            ventas.forEach(v => {
                const horaTxt = v.hora || (v.timestamp_completo ? String(v.timestamp_completo).substring(11, 13) : '');
                const hora = parseInt(String(horaTxt).substring(0, 2), 10);
                if (isNaN(hora) || hora < 0 || hora > 23) return;
                porHora[hora] += parseFloat(v.monto_venta || 0);
            });
            return porHora;
        }

        function getVentasPorMaquina() {
            const porMaquina = {};
            getVentasPeriodo().forEach(v => {
                const maquina = getMaquinaDeVenta(v);
                const nombre = maquina?.nombre || (v.serial_amit ? `Serial ${normSerial(v.serial_amit)}` : 'Desconocida');
                porMaquina[nombre] = (porMaquina[nombre] || 0) + parseFloat(v.monto_venta || 0);
            });
            return porMaquina;
        }

        function getVentasHoyPorEspacio(maquinaId) {
            const res = {};
            getVentasPeriodo().forEach(v => {
                const m = getMaquinaDeVenta(v);
                if (!m || String(m.id) !== String(maquinaId)) return;
                const e = normEspacio(v.espacio);
                if (!e) return;
                res[e] = res[e] || { count: 0, unidades: 0, monto: 0 };
                res[e].count++;
                res[e].unidades += unidadesDeVenta(v);
                res[e].monto += parseFloat(v.monto_venta || 0);
            });
            return res;
        }

        function getTopProductosHoy() {
            const porProducto = {};
            getVentasPeriodo().forEach(v => {
                const producto = getProductoDeVenta(v);
                const maquina = getMaquinaDeVenta(v);
                const nombre = producto
                    ? producto.nombre_producto
                    : `Espacio ${normEspacio(v.espacio) || '?'}${maquina ? ' · ' + maquina.nombre : ''} (sin asignar)`;
                porProducto[nombre] = porProducto[nombre] || { count: 0, monto: 0 };
                porProducto[nombre].count += unidadesDeVenta(v);
                porProducto[nombre].monto += parseFloat(v.monto_venta || 0);
            });
            return Object.entries(porProducto)
                .map(([nombre, d]) => ({ nombre, count: d.count, monto: d.monto }))
                .sort((a, b) => b.count - a.count || b.monto - a.monto)
                .slice(0, 5);
        }

        function getHoraMayorVenta() {
            const porHora = getVentasPorHora();
            let maxHora = 0;
            let maxMonto = 0;
            for (let hora in porHora) {
                if (porHora[hora] > maxMonto) {
                    maxMonto = porHora[hora];
                    maxHora = hora;
                }
            }
            return { hora: parseInt(maxHora), monto: maxMonto };
        }

        function getMaquinaMasProductiva() {
            const porMaquina = getVentasPorMaquina();
            let maxMaquina = '';
            let maxMonto = 0;
            for (let maquina in porMaquina) {
                if (porMaquina[maquina] > maxMonto) {
                    maxMonto = porMaquina[maquina];
                    maxMaquina = maquina;
                }
            }
            return { nombre: maxMaquina, monto: maxMonto };
        }

        window.setPeriodo = function(p) {
            state.periodo = PERIODOS[p] ? p : 'ultimo';
            render();
        };

        // ============================================
        // IMPORTAR VENTAS DESDE EL REPORTE DE PAYSCAN (.xlsx o .csv)
        // ============================================
        const SHEETJS_URL = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
        const IMPORT_LOTE = 500;

        // Nombre de columna del reporte → campo interno (se compara sin tildes ni mayúsculas)
        const PAYSCAN_COLUMNAS = {
            id_transaccion: ['id transaccion'],
            fecha: ['fecha'],
            hora: ['hora'],
            resultado_transaccion: ['resultado transaccion'],
            monto_venta: ['total transaccion'],
            producto_codigo: ['producto'],
            serial_amit: ['serial amit'],
            serial_pos: ['serial pos'],
            comision: ['total comision'],
            neto_comision: ['neto comision'],
            iva_comision: ['iva comision'],
            metodo_pago: ['metodo de pago'],
            marca_tarjeta: ['marca tarjeta'],
            resultado_dispensado: ['resultado dispensado']
        };
        const PAYSCAN_OBLIGATORIAS = ['id_transaccion', 'fecha', 'monto_venta', 'producto_codigo', 'serial_amit'];

        function normHeader(h) {
            return String(h ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
        }

        function cargarScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = () => reject(new Error('No se pudo cargar el lector de Excel. Revisa tu conexión.'));
                document.head.appendChild(s);
            });
        }

        async function asegurarSheetJS() {
            if (typeof XLSX === 'undefined') await cargarScript(SHEETJS_URL);
        }

        // Montos: 1000 | "1000" | "1.000" | "$1.000" | "29,75" | "29.75"
        function parseMonto(v) {
            if (typeof v === 'number') return v;
            let t = String(v ?? '').replace(/[$\s]/g, '');
            if (!t) return 0;
            if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, '').replace(',', '.');
            else if (/^-?\d+,\d+$/.test(t)) t = t.replace(',', '.');
            const n = parseFloat(t);
            return isNaN(n) ? 0 : n;
        }

        function parseFechaImport(v) {
            if (v instanceof Date && !isNaN(v)) {
                return `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}`;
            }
            if (typeof v === 'number' && typeof XLSX !== 'undefined') {
                const d = XLSX.SSF.parse_date_code(v);
                if (d) return `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`;
            }
            const t = String(v ?? '').trim();
            let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (m) return `${m[1]}-${m[2]}-${m[3]}`;
            m = t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
            if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
            return '';
        }

        function parseHoraImport(v) {
            if (v instanceof Date && !isNaN(v)) {
                return [v.getHours(), v.getMinutes(), v.getSeconds()].map(x => String(x).padStart(2, '0')).join(':');
            }
            if (typeof v === 'number') {
                const tot = Math.round((v % 1) * 86400);
                return [Math.floor(tot / 3600), Math.floor((tot % 3600) / 60), tot % 60].map(x => String(x).padStart(2, '0')).join(':');
            }
            const m = String(v ?? '').trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);
            return m ? `${m[1].padStart(2, '0')}:${m[2]}:${m[3] || '00'}` : '00:00:00';
        }

        function textoONull(v) {
            const t = String(v ?? '').trim();
            return t ? t : null;
        }

        // Convierte una fila del reporte en una fila de la tabla ventas_payscan
        function mapFilaPayscan(fila, idx) {
            const get = campo => fila[idx[campo]];
            const fecha = parseFechaImport(get('fecha'));
            const hora = parseHoraImport(get('hora'));
            const serial = textoONull(get('serial_amit'));
            const maquina = serial !== null ? state.maquinas.find(m => normSerial(m.serial_amit) === normSerial(serial)) : null;
            return {
                id_transaccion: textoONull(get('id_transaccion')),
                fecha,
                hora,
                timestamp_completo: fecha ? `${fecha}T${hora}` : null,
                serial_amit: serial,
                serial_pos: textoONull(get('serial_pos')),
                maquina_id: maquina ? String(maquina.id) : null,
                espacio: decodeEspacioPayscan(get('producto_codigo')) || null,
                producto_codigo: textoONull(get('producto_codigo')),
                monto_venta: parseMonto(get('monto_venta')),
                comision: parseMonto(get('comision')),
                neto_comision: parseMonto(get('neto_comision')),
                iva_comision: parseMonto(get('iva_comision')),
                resultado_transaccion: (textoONull(get('resultado_transaccion')) || '').toUpperCase() || null,
                resultado_dispensado: textoONull(get('resultado_dispensado')),
                metodo_pago: textoONull(get('metodo_pago')),
                marca_tarjeta: textoONull(get('marca_tarjeta'))
            };
        }

        async function leerArchivoVentas(file) {
            await asegurarSheetJS();
            const esCsv = /\.csv$/i.test(file.name);
            const wb = esCsv
                ? XLSX.read(await file.text(), { type: 'string', raw: true })
                : XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
            // Hoja "Transacciones" o la primera
            const nombreHoja = wb.SheetNames.find(n => normHeader(n) === 'transacciones') || wb.SheetNames[0];
            const matriz = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], { header: 1, defval: null, raw: true, blankrows: false });
            // Buscar la fila de encabezados (la que tenga "ID transaccion")
            const filaEnc = matriz.findIndex(r => (r || []).some(c => normHeader(c) === 'id transaccion'));
            if (filaEnc < 0) throw new Error('No encontré la columna "ID transaccion". ¿Es el reporte de transacciones de PayScan?');
            const enc = matriz[filaEnc].map(normHeader);
            const idx = {};
            Object.entries(PAYSCAN_COLUMNAS).forEach(([campo, nombres]) => {
                const i = enc.findIndex(h => nombres.includes(h));
                if (i >= 0) idx[campo] = i;
            });
            const faltan = PAYSCAN_OBLIGATORIAS.filter(c => idx[c] === undefined);
            if (faltan.length) throw new Error('Faltan columnas en el archivo: ' + faltan.join(', '));
            return matriz.slice(filaEnc + 1)
                .filter(r => r && r[idx.id_transaccion])
                .map(r => mapFilaPayscan(r, idx));
        }

        async function idsYaImportados(ids) {
            const existentes = new Set();
            if (state.demoMode || !state.session) {
                state.ventas.forEach(v => { if (v.id_transaccion) existentes.add(String(v.id_transaccion)); });
                return existentes;
            }
            for (let i = 0; i < ids.length; i += 100) {
                const lote = ids.slice(i, i + 100);
                const { data, error } = await supabaseClient.from('ventas_payscan').select('id_transaccion').in('id_transaccion', lote);
                if (error) throw new Error('No se pudo verificar duplicados: ' + error.message);
                (data || []).forEach(r => existentes.add(String(r.id_transaccion)));
            }
            return existentes;
        }

        window.openImportModal = function() {
            state.showImportModal = true;
            state.importPreview = null;
            state.importError = '';
            render();
        };

        window.closeImportModal = function() {
            if (state.importLoading) return;
            state.showImportModal = false;
            state.importPreview = null;
            state.importError = '';
            render();
        };

        window.handleImportFile = async function(input) {
            const file = input && input.files && input.files[0];
            if (!file) return;
            state.importLoading = true;
            state.importError = '';
            state.importPreview = null;
            render();
            try {
                const filas = await leerArchivoVentas(file);
                const validas = filas.filter(f => f.id_transaccion && f.fecha);
                const invalidas = filas.length - validas.length;
                // Quitar repetidos dentro del mismo archivo
                const unicas = [...new Map(validas.map(f => [f.id_transaccion, f])).values()];
                const existentes = await idsYaImportados(unicas.map(f => f.id_transaccion));
                const nuevas = unicas.filter(f => !existentes.has(String(f.id_transaccion)));
                const aprobadas = nuevas.filter(f => f.resultado_transaccion === 'APPROVED');
                const fechas = unicas.map(f => f.fecha).sort();
                const porMaquina = {};
                const sinMaquina = new Set();
                aprobadas.forEach(f => {
                    const m = f.maquina_id ? state.maquinas.find(x => String(x.id) === f.maquina_id) : null;
                    const nombre = m ? m.nombre : `Serial ${normSerial(f.serial_amit)} (sin máquina)`;
                    if (!m) sinMaquina.add(f.serial_amit);
                    porMaquina[nombre] = porMaquina[nombre] || { count: 0, monto: 0 };
                    porMaquina[nombre].count++;
                    porMaquina[nombre].monto += f.monto_venta;
                });
                state.importPreview = {
                    archivo: file.name,
                    total: filas.length,
                    invalidas,
                    duplicadas: unicas.length - nuevas.length,
                    nuevas,
                    aprobadas: aprobadas.length,
                    otras: nuevas.length - aprobadas.length,
                    montoAprobado: aprobadas.reduce((s, f) => s + f.monto_venta, 0),
                    desde: fechas[0],
                    hasta: fechas[fechas.length - 1],
                    porMaquina,
                    sinMaquina: [...sinMaquina],
                    sinEspacio: nuevas.filter(f => !f.espacio).length
                };
            } catch (err) {
                console.error(err);
                state.importError = err.message || 'No se pudo leer el archivo.';
            } finally {
                state.importLoading = false;
                render();
            }
        };

        window.confirmarImport = async function() {
            const prev = state.importPreview;
            if (!prev || !prev.nuevas.length) return;
            if (!puedeEscribir()) return;
            state.importLoading = true;
            state.importError = '';
            render();
            let insertadas = 0;
            try {
                for (let i = 0; i < prev.nuevas.length; i += IMPORT_LOTE) {
                    const lote = prev.nuevas.slice(i, i + IMPORT_LOTE);
                    // ignoreDuplicates: si alguna ya existe (otro usuario importó recién), se omite sin error
                    const { error } = await supabaseClient
                        .from('ventas_payscan')
                        .upsert(lote, { onConflict: 'id_transaccion', ignoreDuplicates: true });
                    if (error) throw new Error(`Error en el lote ${i / IMPORT_LOTE + 1}: ${error.message}`);
                    insertadas += lote.length;
                }
                guardarHistorial('IMPORTAR_VENTAS', `${prev.archivo}: ${insertadas} transacciones nuevas (${fmtFecha(prev.desde)} al ${fmtFecha(prev.hasta)})`);
                state.importLoading = false;
                state.showImportModal = false;
                state.importPreview = null;
                state.periodo = 'ultimo';
                await fetchVentas();
                render();
                alert(`✅ ${insertadas} transacciones importadas`);
            } catch (err) {
                console.error(err);
                state.importLoading = false;
                state.importError = err.message + (insertadas ? ` (se alcanzaron a guardar ${insertadas}; puedes volver a importar el mismo archivo, no se duplicarán)` : '');
                render();
            }
        };

        function renderImportModal() {
            if (!state.showImportModal) return '';
            const p = state.importPreview;
            return `
                <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                        <div class="bg-green-700 text-white p-4 flex justify-between items-center sticky top-0">
                            <h3 class="text-xl font-bold">📥 Importar ventas PayScan</h3>
                            <button onclick="window.closeImportModal()" class="text-2xl font-bold" aria-label="Cerrar">✕</button>
                        </div>

        // ============================================
        // INICIALIZAR GRÁFICOS (Chart.js)
        // ============================================
        const chartInstances = {};

        window.initCharts = function() {
            if (typeof Chart === 'undefined') return;
            // Destruir gráficos previos (render() recrea el canvas; evita fugas de memoria / "Canvas is already in use")
            Object.keys(chartInstances).forEach(k => {
                try { chartInstances[k].destroy(); } catch (e) {}
                delete chartInstances[k];
            });

            // Gráfico 1: Ventas por Hora
            const ventasPorHora = getVentasPorHora();
            const horasLabels = Array.from({length: 24}, (_, i) => `${i}:00`);
            const horasData = Object.values(ventasPorHora);

            const ctx1 = document.getElementById('chartVentasHora');
            if (ctx1) {
                chartInstances.hora = new Chart(ctx1, {
                    type: 'line',
                    data: {
                        labels: horasLabels,
                        datasets: [{
                            label: 'Ventas por Hora',
                            data: horasData,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 5,
                            pointBackgroundColor: '#3b82f6',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: true, position: 'top' },
                            title: { display: false }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { callback: v => '$' + v.toLocaleString('es-CL') }
                            }
                        }
                    }
                });
            }

            // Gráfico 2: Ventas por Máquina
            const porMaquina = getVentasPorMaquina();
            const maquinasLabels = Object.keys(porMaquina);
            const maquinasData = Object.values(porMaquina);

            const ctx2 = document.getElementById('chartVentasMaquina');
            if (ctx2) {
                chartInstances.maquina = new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: maquinasLabels,
                        datasets: [{
                            label: 'Ventas por Máquina',
                            data: maquinasData,
                            backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899']
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: true, position: 'top' }
                        },
                        scales: {
                            x: {
                                ticks: { callback: v => '$' + v.toLocaleString('es-CL') }
                            }
                        }
                    }
                });
            }
        };

        // Campos del formulario de producto (compartido entre "Nuevo" y "Editar")

            const np = state.newProduct;
            const familias = np.familia && !familiasForm.includes(np.familia) ? [...familiasForm, np.familia] : familiasForm;
            const field = (label, html) => `<label class="flex flex-col gap-1 text-xs font-bold text-gray-600">${label}${html}</label>`;
            return `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${field('SKU', `<input type="text" placeholder="SKU" value="${esc(np.sku)}" oninput="window.updateNewProduct('sku', this.value)" class="border p-3 rounded font-normal text-sm ${isEdit ? 'bg-gray-100' : ''}" ${isEdit ? 'disabled' : ''}>`)}
                    ${field('Nombre producto', `<input type="text" placeholder="Nombre Producto" value="${esc(np.nombre_producto)}" oninput="window.updateNewProduct('nombre_producto', this.value)" class="border p-3 rounded font-normal text-sm">`)}
                    ${field('Familia', `<select onchange="window.updateNewProduct('familia', this.value)" class="border p-3 rounded font-normal text-sm">
                        ${familias.map(f => `<option value="${esc(f)}" ${np.familia === f ? 'selected' : ''}>${esc(f)}</option>`).join('')}

                    ${field('Precio compra', `<input type="number" min="0" placeholder="Precio Compra" value="${esc(np.precio_compra_unitario)}" oninput="window.updateNewProduct('precio_compra_unitario', this.value)" class="border p-3 rounded font-normal text-sm">`)}
                    ${field('Precio venta', `<input type="number" min="0" placeholder="Precio Venta" value="${esc(np.precio_venta_unitario)}" oninput="window.updateNewProduct('precio_venta_unitario', this.value)" class="border p-3 rounded font-normal text-sm">`)}
                    ${field('Cantidad', `<input type="number" min="0" placeholder="Cantidad" value="${esc(np.cantidad_actual)}" oninput="window.updateNewProduct('cantidad_actual', this.value)" class="border p-3 rounded font-normal text-sm">`)}
                    ${field('Fecha compra', `<input type="date" value="${esc(np.fecha_compra)}" oninput="window.updateNewProduct('fecha_compra', this.value)" class="border p-3 rounded font-normal text-sm">`)}

            const ventasSinAsignar = Object.keys(ventasPorEspacio).filter(e => !asignacionesMaquina.some(a => normEspacio(a.espacio) === e));

            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-2xl font-bold">📍 ${esc(maquina.nombre)}</h2>

                                        <div class="w-16 flex items-center justify-center font-bold text-gray-600 text-xs text-center">Bandeja ${filaIdx + 1}</div>
                                        ${Array.from({ length: columnas }).map((_, colIdx) => {
                                            const espacio = codigoEspacio(filaIdx + 1, colIdx + 1);
                                            const assignment = asignacionesMaquina.find(a => normEspacio(a.espacio) === espacio);
                                            const vendidosHoy = (ventasPorEspacio[espacio] || { unidades: 0 }).unidades;
                                            const product = assignment ? state.inventario.find(p => String(p.sku) === String(assignment.sku)) : null;
                                            
                                            return `
                                                <button type="button" class="grid-cell-large ${assignment ? 'occupied-lg' : 'empty-lg'}"
                                                     onclick="window.openEditAssignmentModal('${esc(maquina.id)}', '${espacio}')">
                                                    <div class="text-center">
                                                        <div class="text-xs font-bold ${assignment ? 'text-blue-100' : 'text-gray-500'} mb-1">${espacio}</div>
                                                        ${assignment ? `
                                                            <div class="text-xs font-bold">${esc(String(product ? product.nombre_producto : assignment.sku + ' (sin stock)').substring(0, 14))}</div>
                                                            <div class="text-lg font-bold text-white">${Number(assignment.cantidad_asignada) || 0}</div>
                                                        ` : `
                                                            <div class="text-xs text-gray-400">Vacío</div>
                                                        `}
                                                        ${vendidosHoy ? `<div class="mt-1 text-[10px] font-bold px-2 py-0.5 rounded-full ${assignment ? 'bg-white text-blue-700' : 'bg-orange-100 text-orange-800'}">${vendidosHoy} vend.</div>` : ''}
                                                    </div>
                                                </button>
                                            `;
                                        }).join('')}
                                    </div>
                                `).join('')}
                            </div>

                        <div class="mt-6 p-4 bg-blue-50 rounded border border-blue-200">

                            </div>

                        ${ventasSinAsignar.length ? `

                                    ${state.scannedProductData && state.scannedProductData.id ? `
                                        <div class="bg-blue-50 p-4 rounded-lg border-2 border-blue-600">
                                            <div class="text-sm font-bold mb-2">📦 Producto Encontrado:</div>
                                            <div class="space-y-1 text-sm">
                                                <div><strong>Nombre:</strong> ${esc(state.scannedProductData.nombre_producto)}</div>
                                                <div><strong>Familia:</strong> ${esc(state.scannedProductData.familia)}</div>
                                                <div><strong>Precio Venta:</strong> $${clp(state.scannedProductData.precio_venta_unitario)}</div>
                                                <div><strong>Cantidad Actual:</strong> ${Number(state.scannedProductData.cantidad_actual) || 0}</div>
                                            </div>
                                        </div>
                                    ` : `
                                        <div class="bg-yellow-50 p-4 rounded-lg border-2 border-yellow-600">
                                            <div class="text-sm font-bold mb-2">⚠️ Producto No Encontrado</div>
                                            <p class="text-sm text-gray-600">Deberás completar los datos manualmente</p>
                                        </div>
                                    `}

                                    <div class="flex gap-3">
                                        <button onclick="window.confirmScannedProduct()" class="flex-1 bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 font-bold">
                                            ✅ Usar Este Código
                                        </button>
                                        <button onclick="window.openScannerModal()" class="flex-1 bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 font-bold">
                                            🔄 Escanear Otro
                                        </button>
                                    </div>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderEditProductModal() {
            if (!state.showEditProductModal || !state.editingProduct) return '';

            return `
                <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                        <div class="bg-blue-600 text-white p-4 flex justify-between items-center sticky top-0">
                            <h3 class="text-xl font-bold">✏️ Editar Producto</h3>
                            <button onclick="window.closeEditProductModal()" class="text-2xl font-bold">✕</button>
                        </div>
                        
                        <div class="p-6 space-y-4">
                            ${renderProductFields([...new Set(['Snacks', 'Bebidas', 'Proteína', 'Dulces', 'Confites', ...state.inventario.map(p => p.familia).filter(Boolean)])], true)}
                            <div class="flex gap-3">
                                <button onclick="window.saveProductChanges()" class="flex-1 bg-green-600 text-white py-3 rounded hover:bg-green-700 font-bold">
                                    ✅ Guardar Cambios
                                </button>
                                <button onclick="window.closeEditProductModal()" class="flex-1 bg-gray-600 text-white py-3 rounded hover:bg-gray-700 font-bold">
                                    ❌ Cancelar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderEditAssignmentModal() {
            if (!state.showEditAssignmentModal) return '';

            return `
                <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-lg max-w-lg w-full max-h-[90vh] overflow-y-auto">
                        <div class="bg-blue-600 text-white p-4 flex justify-between items-center sticky top-0">
                            <h3 class="text-xl font-bold">🎯 Asignar producto · ${describeEspacio(state.newAssignment.espacio)}</h3>
                            <button onclick="window.closeEditAssignmentModal()" class="text-2xl font-bold">✕</button>
                        </div>
                        
                        <div class="p-6 space-y-5">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">📦 Seleccionar Producto</label>
                                <select onchange="window.updateAssignmentField('sku', this.value)" class="w-full border p-3 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="">-- Selecciona un producto --</option>
                                    ${state.inventario.map(p => `
                                        <option value="${esc(p.sku)}" ${String(state.newAssignment.sku) === String(p.sku) ? 'selected' : ''}>
                                            ${esc(p.nombre_producto)} (${esc(p.sku)}) - Disponible: ${Number(p.cantidad_actual) || 0} unid.
                                        </option>
                                    `).join('')}
                                </select>
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">📊 Cantidad a Asignar</label>
                                <input type="number" min="1" value="${state.newAssignment.cantidad_asignada}" oninput="window.updateAssignmentField('cantidad_asignada', this.value)" class="w-full border p-3 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg font-bold">
                                <p class="text-xs text-gray-500 mt-1">Cuántos productos de este tipo irán en el espacio ${state.newAssignment.espacio}</p>
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">🎯 Productos por Slot</label>
                                <input type="number" min="1" value="${state.newAssignment.productos_por_slot}" oninput="window.updateAssignmentField('productos_por_slot', this.value)" class="w-full border p-3 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg font-bold">
                                <p class="text-xs text-gray-500 mt-1">Cuántos productos caben en cada posición dentro del espacio ${state.newAssignment.espacio}</p>
                            </div>

                            ${state.newAssignment.sku ? `
                                <div class="bg-green-50 p-4 rounded border border-green-200">
                                    <div class="text-sm font-bold text-green-900">✅ Resumen:</div>
                                    <div class="text-sm text-green-800 mt-2">
                                        <div>Producto: <strong>${esc(state.inventario.find(p => String(p.sku) === String(state.newAssignment.sku))?.nombre_producto)}</strong></div>
                                        <div>Cantidad Total: <strong>${state.newAssignment.cantidad_asignada} unidades</strong></div>
                                        <div>Productos por Slot: <strong>${state.newAssignment.productos_por_slot}</strong></div>
                                        <div>Slots ocupados: <strong>${Math.ceil(state.newAssignment.cantidad_asignada / state.newAssignment.productos_por_slot)}</strong></div>
                                        <div>Espacio: <strong>${state.newAssignment.espacio}</strong></div>
                                    </div>
                                </div>
                            ` : ''}

                            <div class="flex gap-3">
                                <button onclick="window.saveAssignment()" class="flex-1 bg-green-600 text-white py-3 rounded hover:bg-green-700 font-bold">
                                    ✅ Guardar Asignación
                                </button>
                                <button onclick="window.deleteAssignmentFromModal()" class="flex-1 bg-red-600 text-white py-3 rounded hover:bg-red-700 font-bold">
                                    🗑️ Eliminar
                                </button>
                            </div>

                            <button onclick="window.closeEditAssignmentModal()" class="w-full bg-gray-600 text-white py-2 rounded hover:bg-gray-700 font-bold">
                                ❌ Cancelar
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderLoginScreen() {
            const bloqueado = state.loginBlockedUntil > Date.now();
            return `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-blue-900 p-4">
                    <form class="bg-white rounded-lg shadow-xl max-w-md w-full p-8" onsubmit="event.preventDefault(); window.handleLogin();" autocomplete="on">
                        <div class="text-center mb-6">
                            <div class="text-6xl mb-3">📦</div>
                            <h1 class="text-2xl font-bold">GO BOX Dashboard</h1>
                            <p class="text-gray-600 text-sm">Acceso restringido</p>
                        </div>

                        <div class="space-y-4">
                            <label class="block text-sm font-bold text-gray-700">Correo
                                <input type="email" id="loginEmail" name="email" autocomplete="username" required
                                    value="${esc(state.loginForm.email)}" oninput="window.updateLoginField('email', this.value)"
                                    class="mt-1 w-full border p-3 rounded font-normal focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </label>
                            <label class="block text-sm font-bold text-gray-700">Contraseña
                                <input type="password" id="loginPassword" name="password" autocomplete="current-password" required
                                    value="" oninput="window.updateLoginField('password', this.value)"
                                    class="mt-1 w-full border p-3 rounded font-normal focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </label>
                            ${state.loginError ? `<div class="bg-red-50 border border-red-300 text-red-800 text-sm p-3 rounded" role="alert">${esc(state.loginError)}${state.loginDetalle ? `<div class="mt-1 text-xs text-red-600 font-mono break-all">Detalle: ${esc(state.loginDetalle)}</div>` : ''}</div>` : ''}
                            <button type="submit" ${state.loginLoading || bloqueado ? 'disabled' : ''} class="w-full bg-blue-600 text-white py-3 rounded hover:bg-blue-700 font-bold disabled:opacity-60 disabled:cursor-not-allowed">
                                ${state.loginLoading ? 'Verificando…' : 'Ingresar'}
                            </button>
                        </div>

                        <p class="text-xs text-gray-500 text-center mt-4">Las cuentas se crean desde Supabase. Si olvidaste tu contraseña, pide que te la restablezcan.</p>
                        <p class="text-xs text-center mt-2"><button type="button" onclick="window.limpiarSesionGuardada()" class="text-blue-700 underline">¿Problemas para entrar? Limpiar sesión guardada</button></p>
                    </form>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');

            if (state.loading) {
                app.innerHTML = `
                    <div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-600 to-blue-800">
                        <div class="text-white text-center">
                            <div class="text-6xl mb-4 animate-bounce">📦</div>
                            <div class="text-2xl font-bold">GO BOX Dashboard</div>
                            <div class="text-sm mt-2 opacity-80">Cargando datos...</div>
                        </div>
                    </div>
                `;
                return;
            }

            // Sin sesión: solo se muestra el login (el dashboard ni siquiera se dibuja detrás)
            if (!state.session && !state.demoMode) {
                app.innerHTML = renderLoginScreen();
                const campo = document.getElementById(state.loginForm.email ? 'loginPassword' : 'loginEmail');
                if (campo) campo.focus();
                return;
            }

            const contentMap = {
                dashboard: renderDashboard,
                inventario: renderInventario,
                asignaciones: renderAsignaciones,
                historial: renderHistorial,
                maquinas: renderMaquinas,
                analytics: renderAnalytics,
            };

            // Un error en una pestaña ya no deja la pantalla en blanco
            let content;
            try {
                content = (contentMap[state.activeTab] || renderDashboard)();
            } catch (err) {
                console.error('Error renderizando pestaña:', err);
                content = `<div class="bg-red-50 border border-red-300 text-red-800 p-6 rounded-lg">❌ Error al mostrar esta sección: ${esc(err.message)}</div>`;
            }

            // Guardar foco y cursor antes de redibujar (antes al escribir en la búsqueda o formularios se perdía el foco)
            const active = document.activeElement;
            let focusInfo = null;
            if (active && app.contains(active) && /^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName)) {
                const fields = Array.from(app.querySelectorAll('input, select, textarea'));
                focusInfo = { index: fields.indexOf(active), id: active.id };
                try { focusInfo.start = active.selectionStart; focusInfo.end = active.selectionEnd; } catch (e) {}
            }

            app.innerHTML = `
                <div class="min-h-screen bg-gray-50">
                    <header class="bg-gradient-to-r from-blue-600 to-blue-800 text-white shadow-lg sticky top-0 z-40">
                        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center flex-wrap gap-4">
                            <div class="flex items-center gap-3">
                                <div class="text-4xl">📦</div>
                                <div>
                                    <div class="logo">
                                        <span class="logo-go">GO</span><span class="logo-box">BOX</span>
                                    </div>
                                    <div class="text-xs opacity-80">Tu Tienda 24/7</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="text-sm">👤 ${esc(state.currentUser)}</div>
                                <button onclick="window.handleLogout()" class="bg-red-600 text-white px-4 py-2 rounded font-bold hover:bg-red-700">
                                    🚪 Salir
                                </button>
                                <button onclick="window.fetchAllData()" class="bg-white text-blue-600 px-4 py-2 rounded font-bold hover:bg-gray-100">
                                    🔄 Actualizar
                                </button>
                            </div>
                        </div>
                    </header>

                    ${state.demoMode ? `
                        <div class="bg-yellow-100 border-b border-yellow-300 text-yellow-900 text-sm text-center py-2 px-4">
                            ⚠️ Modo demo: datos de ejemplo, los cambios no se guardan.
                        </div>
                    ` : ''}
                    ${state.loadError ? `
                        <div class="bg-red-100 border-b border-red-300 text-red-900 text-sm text-center py-2 px-4" role="alert">
                            ❌ ${esc(state.loadError)}
                        </div>
                    ` : ''}

                    <div class="max-w-7xl mx-auto px-4 py-6">
                        <div class="flex gap-2 mb-6 overflow-x-auto border-b">
                            <button onclick="window.setTab('dashboard')" class="tab-btn ${state.activeTab === 'dashboard' ? 'active' : ''} flex items-center gap-2 px-4 py-3 border-b-2 font-bold whitespace-nowrap text-gray-700">
                                📊 Dashboard
                            </button>
                            <button onclick="window.setTab('analytics')" class="tab-btn ${state.activeTab === 'analytics' ? 'active' : ''} flex items-center gap-2 px-4 py-3 border-b-2 font-bold whitespace-nowrap text-gray-700">
                                📈 Analítica
                            </button>
                            <button onclick="window.setTab('inventario')" class="tab-btn ${state.activeTab === 'inventario' ? 'active' : ''} flex items-center gap-2 px-4 py-3 border-b-2 font-bold whitespace-nowrap text-gray-700">
                                📦 Inventario
                            </button>
                            <button onclick="window.setTab('asignaciones')" class="tab-btn ${state.activeTab === 'asignaciones' ? 'active' : ''} flex items-center gap-2 px-4 py-3 border-b-2 font-bold whitespace-nowrap text-gray-700">
                                🎯 Asignaciones
                            </button>
                            <button onclick="window.setTab('historial')" class="tab-btn ${state.activeTab === 'historial' ? 'active' : ''} flex items-center gap-2 px-4 py-3 border-b-2 font-bold whitespace-nowrap text-gray-700">
                                📋 Historial
                            </button>
                            <button onclick="window.setTab('maquinas')" class="tab-btn ${state.activeTab === 'maquinas' ? 'active' : ''} flex items-center gap-2 px-4 py-3 border-b-2 font-bold whitespace-nowrap text-gray-700">
                                ⚙️ Máquinas
                            </button>
                        </div>

                        ${content}
                    </div>

                    <footer class="bg-gray-900 text-white text-center py-6 mt-12">
                        <div>GO BOX Dashboard v5.0 | Concepción, Chile 🇨🇱</div>
                    </footer>
                </div>

                ${state.showScannerModal ? renderScannerModal() : ''}
                ${state.showEditProductModal ? renderEditProductModal() : ''}
                ${state.showEditAssignmentModal ? renderEditAssignmentModal() : ''}
                ${state.showImportModal ? renderImportModal() : ''}
            `;

            // Restaurar foco y cursor
            if (focusInfo) {
                const fields = Array.from(app.querySelectorAll('input, select, textarea'));
                const target = (focusInfo.id && document.getElementById(focusInfo.id)) || fields[focusInfo.index];
                if (target) {
                    target.focus();
                    try { if (focusInfo.start !== null && focusInfo.start !== undefined) target.setSelectionRange(focusInfo.start, focusInfo.end); } catch (e) {}
                }
            }

            // Inicializar gráficos cuando estamos en dashboard (con instancias previas destruidas en initCharts)
            if (state.activeTab === 'dashboard') {
                setTimeout(() => window.initCharts(), 50);
            }
        }

        window.addEventListener('load', iniciarApp);
    </script>
</body>
</html>
